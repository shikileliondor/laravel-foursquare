name: deploy

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ftp:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: project
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Build application
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          npm ci
          npm run build

      - name: Package release ZIP
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip lftp
          release_dir="$(mktemp -d)"
          archive="$RUNNER_TEMP/foursquare-release.zip"
          cp -a app artisan bootstrap composer.json composer.lock config database public resources routes vendor .env.example "$release_dir/"
          mkdir -p "$release_dir/storage/app/private" "$release_dir/storage/app/public" "$release_dir/storage/framework/cache/data" "$release_dir/storage/framework/sessions" "$release_dir/storage/framework/views" "$release_dir/storage/logs"
          (cd "$release_dir" && zip -qr "$archive" .)
          unzip -tq "$archive"
          if unzip -Z -1 "$archive" | grep -Eq '(^|/)\.env$'; then
            echo 'The release archive must not contain .env' >&2
            exit 1
          fi

      - name: Upload ZIP via explicit FTPS
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          : "${FTP_PASSWORD:?Set FTP_PASSWORD in the production environment}"
          : "${FTP_SERVER_DIR:?Set FTP_SERVER_DIR in the production environment}"
          lftp -u 'c2860566c@winestock.studiobeyam.net',"$FTP_PASSWORD" -p 21 ftp://web42.lws-hosting.com -e "
            set cmd:fail-exit yes
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate true
            put \"$RUNNER_TEMP/foursquare-release.zip\" -o \"$FTP_SERVER_DIR/foursquare-release.zip\"
            bye
          "
