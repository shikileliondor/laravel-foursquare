<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Foursquare CI — Admin</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f5f6f8;
                --surface: #fff;
                --surface-2: #f0f2f5;
                --line: #e2e5ea;
                --line-strong: #cfd4dc;
                --text: #171a1f;
                --muted: #6a7280;
                --accent: #2f6df6;
                --on-accent: #fff;
                --ok: #17713c;
                --ok-bg: #e7f5ec;
                --warn: #855200;
                --warn-bg: #fcf1df;
                --bad: #b5372c;
                --bad-bg: #fdeceb;
                --radius: 8px;
                --shadow: 0 1px 2px rgb(16 24 40 / 6%);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0f1216;
                    --surface: #161a20;
                    --surface-2: #1b2027;
                    --line: #262c35;
                    --line-strong: #39414d;
                    --text: #e5eaf1;
                    --muted: #8b95a3;
                    --accent: #4d8bff;
                    --ok: #5ac47c;
                    --ok-bg: #11271a;
                    --warn: #dfa831;
                    --warn-bg: #2a2212;
                    --bad: #f0796f;
                    --bad-bg: #2d1716;
                    --shadow: none;
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font:
                    14px/1.55 system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            h1,
            h2,
            h3 {
                margin: 0;
                letter-spacing: -0.01em;
            }

            a {
                color: var(--accent);
            }

            img {
                display: block;
                max-width: 100%;
            }

            :focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            /* ------------------------------------------------------ controls */
            button {
                font: inherit;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 7px 13px;
                border: 1px solid var(--line-strong);
                border-radius: var(--radius);
                background: var(--surface);
                color: var(--text);
                cursor: pointer;
                white-space: nowrap;
                transition:
                    background 0.12s,
                    border-color 0.12s;
            }

            .btn:hover:not(:disabled) {
                background: var(--surface-2);
            }

            .btn.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: var(--on-accent);
            }

            .btn.primary:hover:not(:disabled) {
                filter: brightness(1.08);
                background: var(--accent);
            }

            .btn.ghost {
                border-color: transparent;
                background: transparent;
                color: var(--muted);
            }

            .btn.ghost:hover:not(:disabled) {
                color: var(--text);
                background: var(--surface-2);
            }

            .btn.danger {
                color: var(--bad);
            }

            .btn.sm {
                padding: 4px 9px;
                font-size: 13px;
            }

            .btn:disabled {
                opacity: 0.45;
                cursor: default;
            }

            input,
            select,
            textarea {
                font: inherit;
                width: 100%;
                padding: 7px 10px;
                border: 1px solid var(--line-strong);
                border-radius: var(--radius);
                background: var(--surface);
                color: var(--text);
            }

            input:focus,
            select:focus,
            textarea:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 3px
                    color-mix(in srgb, var(--accent) 18%, transparent);
            }

            textarea {
                min-height: 130px;
                resize: vertical;
            }

            label {
                display: block;
                margin-bottom: 5px;
                color: var(--muted);
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.02em;
            }

            .hint {
                margin: 5px 0 0;
                color: var(--muted);
                font-size: 12px;
            }

            .err {
                margin: 5px 0 0;
                color: var(--bad);
                font-size: 12px;
            }

            /* --------------------------------------------------------- badge */
            .badge {
                display: inline-block;
                padding: 1px 8px;
                border-radius: 999px;
                border: 1px solid transparent;
                background: var(--surface-2);
                color: var(--muted);
                font-size: 12px;
                font-weight: 600;
            }

            .badge.ok {
                background: var(--ok-bg);
                color: var(--ok);
            }

            .badge.warn {
                background: var(--warn-bg);
                color: var(--warn);
            }

            .badge.bad {
                background: var(--bad-bg);
                color: var(--bad);
            }

            /* --------------------------------------------------------- login */
            #login {
                width: min(360px, calc(100vw - 32px));
                margin: 14vh auto;
                padding: 28px;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 12px;
                box-shadow: var(--shadow);
            }

            #login h1 {
                font-size: 17px;
            }

            #login p {
                margin: 2px 0 22px;
                color: var(--muted);
                font-size: 13px;
            }

            #login .field {
                margin-bottom: 14px;
            }

            #login .btn {
                width: 100%;
                justify-content: center;
            }

            /* --------------------------------------------------------- shell */
            #app {
                display: grid;
                grid-template-columns: 220px minmax(0, 1fr);
                min-height: 100vh;
            }

            nav {
                position: sticky;
                top: 0;
                height: 100vh;
                display: flex;
                flex-direction: column;
                gap: 2px;
                padding: 18px 12px;
                background: var(--surface);
                border-right: 1px solid var(--line);
            }

            nav .brand {
                padding: 0 8px 18px;
                font-size: 14px;
                font-weight: 700;
                letter-spacing: -0.01em;
            }

            nav .group {
                margin: 14px 0 4px;
                padding: 0 8px;
                color: var(--muted);
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            nav a {
                padding: 6px 8px;
                border-radius: 6px;
                color: var(--text);
                text-decoration: none;
                font-size: 13.5px;
            }

            nav a:hover {
                background: var(--surface-2);
            }

            nav a.active {
                background: var(--accent);
                color: var(--on-accent);
                font-weight: 600;
            }

            nav .spacer {
                flex: 1;
            }

            nav .me {
                margin-top: 12px;
                padding: 10px 8px;
                border-top: 1px solid var(--line);
                color: var(--muted);
                font-size: 12px;
            }

            nav .me strong {
                display: block;
                color: var(--text);
                font-size: 13px;
            }

            main {
                min-width: 0;
                padding-bottom: 48px;
            }

            .head {
                position: sticky;
                top: 0;
                z-index: 3;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 18px 26px;
                background: color-mix(in srgb, var(--bg) 88%, transparent);
                backdrop-filter: blur(8px);
                border-bottom: 1px solid var(--line);
            }

            .head h1 {
                flex: 1;
                font-size: 18px;
            }

            .head input[type='search'] {
                width: 210px;
            }

            .body {
                padding: 22px 26px;
            }

            .card {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 10px;
                box-shadow: var(--shadow);
                overflow: hidden;
            }

            .empty {
                padding: 48px 20px;
                text-align: center;
                color: var(--muted);
            }

            /* --------------------------------------------------------- table */
            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                padding: 10px 14px;
                text-align: left;
                border-bottom: 1px solid var(--line);
                vertical-align: middle;
            }

            tr:last-child td {
                border-bottom: 0;
            }

            th {
                color: var(--muted);
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            tbody tr:hover {
                background: var(--surface-2);
            }

            td.title {
                font-weight: 600;
            }

            td.acts {
                text-align: right;
                white-space: nowrap;
            }

            .rowthumb {
                width: 54px;
                height: 38px;
                border-radius: 5px;
                border: 1px solid var(--line);
                background: var(--surface-2);
                overflow: hidden;
            }

            .rowthumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .pager {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 12px 14px;
                border-top: 1px solid var(--line);
                color: var(--muted);
                font-size: 13px;
            }

            .pager .spacer {
                flex: 1;
            }

            /* ------------------------------------------------------- gallery */
            .gallery {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 14px;
            }

            .tile {
                position: relative;
                display: block;
                width: 100%;
                padding: 0;
                border: 1px solid var(--line);
                border-radius: 9px;
                background: var(--surface);
                overflow: hidden;
                cursor: pointer;
                text-align: left;
            }

            .tile img {
                width: 100%;
                aspect-ratio: 4 / 3;
                object-fit: cover;
                background: var(--surface-2);
            }

            .tile .name {
                display: block;
                padding: 7px 9px;
                color: var(--muted);
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .tile:hover {
                border-color: var(--line-strong);
            }

            .tile[aria-pressed='true'] {
                border-color: var(--accent);
                box-shadow: 0 0 0 2px var(--accent);
            }

            .tile .tools {
                position: absolute;
                inset: auto 6px 34px auto;
                display: flex;
                gap: 6px;
                opacity: 0;
                transition: opacity 0.12s;
            }

            .tile:hover .tools,
            .tile:focus-within .tools {
                opacity: 1;
            }

            .tools .btn {
                padding: 3px 8px;
                font-size: 12px;
                box-shadow: var(--shadow);
            }

            .dropzone {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 120px;
                border: 1.5px dashed var(--line-strong);
                border-radius: 9px;
                color: var(--muted);
                cursor: pointer;
                text-align: center;
                font-size: 13px;
            }

            .dropzone:hover,
            .dropzone.over {
                border-color: var(--accent);
                color: var(--accent);
            }

            /* ---------------------------------------------------------- form */
            .grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
                padding: 20px;
            }

            .grid .wide {
                grid-column: 1 / -1;
            }

            .check {
                display: flex;
                align-items: center;
                gap: 9px;
            }

            .check input {
                width: 16px;
                height: 16px;
            }

            .check label {
                margin: 0;
                font-size: 13.5px;
                font-weight: 500;
                color: var(--text);
            }

            .actions {
                display: flex;
                gap: 10px;
                margin-top: 4px;
                padding-top: 18px;
                border-top: 1px solid var(--line);
            }

            .actions .spacer {
                flex: 1;
            }

            /* image field */
            .imgfield {
                display: flex;
                gap: 14px;
                align-items: flex-start;
            }

            .imgprev {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 168px;
                height: 116px;
                flex: none;
                border: 1px solid var(--line);
                border-radius: 9px;
                background: var(--surface-2);
                color: var(--muted);
                font-size: 12px;
                overflow: hidden;
            }

            .imgprev img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .imgacts {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: flex-start;
            }

            .imgacts .hint {
                width: 100%;
            }

            /* rich text */
            .toolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                margin-bottom: 7px;
            }

            .toolbar .btn {
                padding: 3px 9px;
                font-size: 12.5px;
            }

            .preview {
                padding: 14px 16px;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: var(--surface-2);
                min-height: 130px;
            }

            .preview > :first-child {
                margin-top: 0;
            }

            .preview > :last-child {
                margin-bottom: 0;
            }

            /* --------------------------------------------------------- modal */
            .overlay {
                position: fixed;
                inset: 0;
                z-index: 20;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                background: rgb(9 12 16 / 55%);
            }

            .modal {
                display: flex;
                flex-direction: column;
                width: min(860px, 100%);
                max-height: min(640px, 100%);
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 12px;
                overflow: hidden;
            }

            .modal header,
            .modal footer {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 13px 16px;
                background: var(--surface);
            }

            .modal header {
                border-bottom: 1px solid var(--line);
            }

            .modal footer {
                border-top: 1px solid var(--line);
            }

            .modal header h2 {
                flex: 1;
                font-size: 15px;
            }

            .modal .content {
                flex: 1;
                padding: 16px;
                overflow: auto;
            }

            .modal footer .spacer {
                flex: 1;
            }

            .modal footer span {
                color: var(--muted);
                font-size: 13px;
            }

            /* --------------------------------------------------------- toast */
            #toast {
                position: fixed;
                right: 18px;
                bottom: 18px;
                z-index: 40;
                display: none;
                max-width: 340px;
                padding: 11px 16px;
                border: 1px solid var(--line);
                border-left: 3px solid var(--accent);
                border-radius: var(--radius);
                background: var(--surface);
                box-shadow: 0 6px 20px rgb(16 24 40 / 14%);
            }

            #toast.bad {
                border-left-color: var(--bad);
            }

            @media (max-width: 780px) {
                #app {
                    grid-template-columns: 1fr;
                }

                nav {
                    position: static;
                    height: auto;
                    flex-direction: row;
                    flex-wrap: wrap;
                    align-items: center;
                    padding: 10px;
                    border-right: 0;
                    border-bottom: 1px solid var(--line);
                }

                nav .brand,
                nav .group,
                nav .spacer,
                nav .me {
                    display: none;
                }

                .head,
                .body {
                    padding: 14px 16px;
                }

                .head input[type='search'] {
                    width: 130px;
                }

                .grid {
                    grid-template-columns: 1fr;
                    padding: 16px;
                }

                .imgfield {
                    flex-direction: column;
                }
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <div id="modal"></div>
        <div id="toast"></div>

        <script>
            const BASE = location.pathname.replace(/\/admin\/?$/, '');
            const API = location.origin + BASE + '/api/v1';
            const ACCEPT = 'image/jpeg,image/png,image/webp';
            const $ = (id) => document.getElementById(id);
            const root = $('root');

            let token = localStorage.getItem('fq_token');
            let me = null;
            let state = { key: 'news', page: 1, search: '', editing: null };

            // --------------------------------------------------------- options
            const STATUS = ['ACTIVE', 'INACTIVE'];
            const SCOPE = ['NATIONAL', 'DISTRICT', 'ZONE', 'CHURCH'];
            const PRIORITY = ['NORMAL', 'IMPORTANT', 'URGENT'];

            // Colour for the enum values that show up in list columns.
            const TONE = {
                PUBLISHED: 'ok',
                ACTIVE: 'ok',
                SENT: 'ok',
                ONGOING: 'ok',
                PENDING: 'warn',
                PROCESSING: 'warn',
                IMPORTANT: 'warn',
                UPCOMING: 'warn',
                URGENT: 'bad',
                FAILED: 'bad',
                CANCELLED: 'bad',
            };

            const scopeFields = () => [
                {
                    name: 'scope_type',
                    label: 'Portée',
                    type: 'select',
                    options: SCOPE,
                    required: true,
                },
                {
                    name: 'district_id',
                    label: 'District',
                    type: 'ref',
                    ref: 'districts',
                    showIf: (v) => v.scope_type === 'DISTRICT',
                },
                {
                    name: 'zone_id',
                    label: 'Zone',
                    type: 'ref',
                    ref: 'zones',
                    showIf: (v) => v.scope_type === 'ZONE',
                },
                {
                    name: 'church_id',
                    label: 'Église',
                    type: 'ref',
                    ref: 'churches',
                    showIf: (v) => v.scope_type === 'CHURCH',
                },
            ];

            // ------------------------------------------------------- resources
            const RESOURCES = {
                news: {
                    label: 'Actualités',
                    group: 'Contenu',
                    search: true,
                    columns: [
                        ['cover.url', '', 'thumb'],
                        ['title', 'Titre', 'title'],
                        ['scope_type', 'Portée'],
                        ['priority', 'Priorité'],
                        ['status', 'Statut'],
                    ],
                    fields: [
                        {
                            name: 'title',
                            label: 'Titre',
                            required: true,
                            wide: true,
                        },
                        {
                            name: 'cover_media_id',
                            label: 'Image de couverture',
                            type: 'image',
                            wide: true,
                        },
                        {
                            name: 'excerpt',
                            label: 'Résumé',
                            type: 'textarea',
                            rows: 3,
                            wide: true,
                            hint: 'Court paragraphe affiché dans la liste de l’application. 500 caractères max.',
                        },
                        {
                            name: 'content',
                            label: 'Contenu',
                            type: 'richtext',
                            required: true,
                            wide: true,
                        },
                        ...scopeFields(),
                        {
                            name: 'priority',
                            label: 'Priorité',
                            type: 'select',
                            required: true,
                            options: PRIORITY,
                        },
                        {
                            name: 'status',
                            label: 'Statut',
                            type: 'select',
                            required: true,
                            options: ['DRAFT', 'PUBLISHED', 'ARCHIVED'],
                        },
                        {
                            name: 'published_at',
                            label: 'Publier le',
                            type: 'datetime-local',
                            hint: 'Laisser vide pour publier immédiatement.',
                        },
                        {
                            name: 'is_featured',
                            label: 'Mettre à la une',
                            type: 'checkbox',
                        },
                    ],
                },
                events: {
                    label: 'Événements',
                    group: 'Contenu',
                    search: true,
                    columns: [
                        ['cover.url', '', 'thumb'],
                        ['title', 'Titre', 'title'],
                        ['start_at', 'Début'],
                        ['time_status', 'Quand'],
                        ['status', 'Statut'],
                    ],
                    fields: [
                        {
                            name: 'title',
                            label: 'Titre',
                            required: true,
                            wide: true,
                        },
                        {
                            name: 'cover_media_id',
                            label: 'Image de couverture',
                            type: 'image',
                            wide: true,
                        },
                        {
                            name: 'description',
                            label: 'Description',
                            type: 'richtext',
                            required: true,
                            wide: true,
                        },
                        {
                            name: 'start_at',
                            label: 'Début',
                            type: 'datetime-local',
                            required: true,
                        },
                        {
                            name: 'end_at',
                            label: 'Fin',
                            type: 'datetime-local',
                            required: true,
                        },
                        { name: 'organizer_name', label: 'Organisateur' },
                        { name: 'venue_name', label: 'Lieu' },
                        { name: 'address', label: 'Adresse' },
                        { name: 'commune', label: 'Commune' },
                        { name: 'contact_phone', label: 'Téléphone' },
                        { name: 'official_whatsapp', label: 'WhatsApp' },
                        { name: 'latitude', label: 'Latitude', type: 'number' },
                        {
                            name: 'longitude',
                            label: 'Longitude',
                            type: 'number',
                        },
                        ...scopeFields(),
                        {
                            name: 'priority',
                            label: 'Priorité',
                            type: 'select',
                            required: true,
                            options: PRIORITY,
                        },
                        {
                            name: 'status',
                            label: 'Statut',
                            type: 'select',
                            required: true,
                            options: [
                                'DRAFT',
                                'PUBLISHED',
                                'CANCELLED',
                                'ARCHIVED',
                            ],
                        },
                        {
                            name: 'is_featured',
                            label: 'Mettre à la une',
                            type: 'checkbox',
                        },
                    ],
                },
                banners: {
                    label: 'Bannières',
                    group: 'Contenu',
                    search: true,
                    columns: [
                        ['media.url', '', 'thumb'],
                        ['title', 'Titre', 'title'],
                        ['link_type', 'Lien'],
                        ['display_order', 'Ordre'],
                        ['is_active', 'Active'],
                    ],
                    fields: [
                        {
                            name: 'media_id',
                            label: 'Image',
                            type: 'image',
                            required: true,
                            wide: true,
                        },
                        { name: 'title', label: 'Titre', required: true },
                        { name: 'subtitle', label: 'Sous-titre' },
                        { name: 'button_text', label: 'Texte du bouton' },
                        {
                            name: 'display_order',
                            label: 'Ordre d’affichage',
                            type: 'number',
                            hint: 'Le plus petit s’affiche en premier.',
                        },
                        {
                            name: 'link_type',
                            label: 'Type de lien',
                            type: 'select',
                            options: [
                                'NONE',
                                'NEWS',
                                'EVENT',
                                'CHURCH',
                                'EXTERNAL',
                            ],
                            required: true,
                        },
                        {
                            name: 'news_id',
                            label: 'Actualité liée',
                            type: 'ref',
                            ref: 'news',
                            showIf: (v) => v.link_type === 'NEWS',
                        },
                        {
                            name: 'event_id',
                            label: 'Événement lié',
                            type: 'ref',
                            ref: 'events',
                            showIf: (v) => v.link_type === 'EVENT',
                        },
                        {
                            name: 'church_id',
                            label: 'Église liée',
                            type: 'ref',
                            ref: 'churches',
                            showIf: (v) => v.link_type === 'CHURCH',
                        },
                        {
                            name: 'external_url',
                            label: 'URL externe',
                            showIf: (v) => v.link_type === 'EXTERNAL',

            // ------------------------------------------------------------ api
            async function api(path, { method = 'GET', body, raw } = {}) {
                const res = await fetch(API + path, {
                    method,
                    headers: Object.assign(
                        { Accept: 'application/json' },
                        token ? { Authorization: 'Bearer ' + token } : {},
                        raw ? {} : { 'Content-Type': 'application/json' },
                    ),
                    body: raw ? body : body ? JSON.stringify(body) : undefined,
                });

                const json = await res.json().catch(() => ({}));

                if (res.status === 401 && token) {
                    logout();
                    throw new Error('Session expirée');
                }
                if (!res.ok) {
                    const e = new Error(json?.error?.message || 'Erreur');
                    e.payload = json?.error;
                    throw e;
                }

                return json;
            }

            function toast(message, bad = false) {
                const el = $('toast');
                el.textContent = message;
                el.className = bad ? 'bad' : '';
                el.style.display = 'block';
                clearTimeout(toast.timer);
                toast.timer = setTimeout(() => {
                    el.style.display = 'none';
                }, 3200);
            }

            // ----------------------------------------------------------- auth
            async function login(email, password) {
                const res = await api('/auth/login', {
                    method: 'POST',
                    body: { email, password, device_name: 'panel' },
                });
                token = res.data.token;
                me = res.data.user;
                localStorage.setItem('fq_token', token);
                renderApp();
            }

            function logout() {
                if (token)
                    api('/auth/logout', { method: 'POST' }).catch(() => {});
                token = null;
                me = null;
                localStorage.removeItem('fq_token');
                renderLogin();
            }

            // -------------------------------------------------------- helpers
            const esc = (v) =>
                String(v ?? '').replace(
                    /[&<>"']/g,
                    (c) =>
                        ({
                            '&': '&amp;',
                            '<': '&lt;',
                            '>': '&gt;',
                            '"': '&quot;',
                            "'": '&#39;',
                        })[c],
                );

            const dig = (row, path) =>
                path.split('.').reduce((o, k) => (o == null ? o : o[k]), row);

            const label = (row) =>
                row.title || row.name || row.original_name || row.id;

            const fmtDate = (v) => new Date(v).toLocaleString('fr-FR');

            const badge = (v) =>
                `<span class="badge ${TONE[v] || ''}">${esc(v)}</span>`;

            function cell(row, [path, , type]) {
                const v = dig(row, path);

                if (type === 'thumb')
                    return `<div class="rowthumb">${
                        v ? `<img src="${esc(v)}" alt="" loading="lazy">` : ''
                    }</div>`;

                if (v === true) return '<span class="badge ok">oui</span>';
                if (v === false) return '<span class="badge">non</span>';
                if (v == null || v === '')
                    return '<span class="badge">—</span>';
                if (/_at$/.test(path)) return esc(fmtDate(v));
                if (typeof v === 'string' && /^[A-Z][A-Z_]+$/.test(v))
                    return badge(v);

                return esc(v);
            }

            // Relation dropdowns stay small; cache them per resource.
            const refCache = {};
            async function refOptions(key) {
                if (!refCache[key]) {
                    refCache[key] = api('/admin/' + key + '?per_page=100')
                        .then((r) =>
                            r.data.map((row) => ({
                                id: row.id,
                                label: label(row),
                            })),
                        )
                        .catch(() => []);
                }
                return refCache[key];
            }

            // id -> media, so a preview never refetches what we already saw.
            const mediaCache = {};

            function remember(media) {
                if (media && media.id) mediaCache[media.id] = media;
                return media;
            }

            async function getMedia(id) {
                if (!id) return null;
                if (mediaCache[id]) return mediaCache[id];
                try {
                    return remember((await api('/admin/media/' + id)).data);
                } catch {
                    return null;
                }
            }

            // The API only gives the nested object; keep its url for previews.
            function rememberRowMedia(row) {
                ['cover', 'media', 'image'].forEach((k) => remember(row[k]));
                return row;
            }

            async function upload(file) {
                const form = new FormData();
                form.append('file', file);
                const res = await api('/admin/media', {
                    method: 'POST',
                    body: form,
                    raw: true,
                });
                delete refCache.media;
                return remember(res.data);
            }

            // ------------------------------------------------------ media grid
            function tile(media, { selected = false, tools = '' } = {}) {
                return `
            <button type="button" class="tile" data-id="${esc(media.id)}" aria-pressed="${selected}">
              <img src="${esc(media.url)}" alt="" loading="lazy">
              ${tools ? `<span class="tools">${tools}</span>` : ''}
              <span class="name">${esc(media.original_name || '')}</span>
            </button>`;
            }

            // --------------------------------------------------- media picker
            /** Resolves with a media object, null to clear, or undefined on cancel. */
            function pickMedia(currentId) {
                return new Promise((resolve) => {
                    let page = 1;
                    let last = 1;

                    $('modal').innerHTML = `
            <div class="overlay" data-dismiss>
              <div class="modal" role="dialog" aria-modal="true" aria-label="Choisir une image">
                <header>
                  <h2>Choisir une image</h2>
                  <label class="btn">Importer…
                    <input type="file" accept="${ACCEPT}" multiple hidden id="pickup">
                  </label>
                  <button class="btn ghost" data-close aria-label="Fermer">✕</button>
                </header>
                <div class="content"><div class="gallery" id="pickgrid"></div></div>
                <footer>
                  <button class="btn ghost" data-clear>Aucune image</button>
                  <span class="spacer"></span>
                  <span id="pickinfo"></span>
                  <button class="btn sm" data-prev>Précédent</button>
                  <button class="btn sm" data-next>Suivant</button>
                </footer>
              </div>
            </div>`;

                    const modal = $('modal');
                    const grid = $('pickgrid');
                    const q = (sel) => modal.querySelector(sel);

                    const close = (value) => {
                        document.removeEventListener('keydown', onKey);
                        modal.innerHTML = '';
                        resolve(value);
                    };

                    const onKey = (e) => {
                        if (e.key === 'Escape') close(undefined);
                    };
                    document.addEventListener('keydown', onKey);

                    const load = async () => {
                        grid.innerHTML = '<p class="empty">Chargement…</p>';
                        let data, meta;
                        try {
                            ({ data, meta } = await api(
                                `/admin/media?page=${page}&per_page=24`,
                            ));
                        } catch (err) {
                            grid.innerHTML = `<p class="empty">${esc(err.message)}</p>`;
                            return;
                        }

                        last = meta.last_page;
                        data.forEach(remember);

                        grid.innerHTML = data.length
                            ? data
                                  .map((m) =>
                                      tile(m, { selected: m.id === currentId }),
                                  )
                                  .join('')
                            : '<p class="empty">Aucune image. Importez-en une.</p>';

                        grid.querySelectorAll('.tile').forEach((el) => {
                            el.onclick = () =>
                                close(mediaCache[el.dataset.id] || null);
                        });

                        q('#pickinfo').textContent =
                            `page ${meta.page}/${last}`;
                        q('[data-prev]').disabled = page <= 1;
                        q('[data-next]').disabled = page >= last;
                    };

                    q('#pickup').onchange = async (e) => {
                        const files = [...e.target.files];
                        e.target.value = '';
                        if (!files.length) return;
                        try {
                            const uploaded = [];
                            for (const file of files)
                                uploaded.push(await upload(file));
                            toast(`${uploaded.length} image(s) importée(s)`);
                            close(uploaded[uploaded.length - 1]);
                        } catch (err) {
                            toast(err.message, true);
                        }
                    };

                    q('[data-close]').onclick = () => close(undefined);
                    q('[data-clear]').onclick = () => close(null);
                    q('[data-prev]').onclick = () => {
                        page--;
                        load();
                    };
                    q('[data-next]').onclick = () => {
                        page++;
                        load();
                    };
                    q('[data-dismiss]').onclick = (e) => {
                        if (e.target === e.currentTarget) close(undefined);
                    };

                    load();
                });
            }

            // --------------------------------------------------------- render
            function renderLogin(error = '') {
                root.innerHTML = `
            <form id="login">
              <h1>Foursquare CI</h1>
              <p>Panel d’administration</p>
              <div class="field"><label for="l_email">Email</label><input id="l_email" name="email" type="email" required autofocus></div>
              <div class="field"><label for="l_pass">Mot de passe</label><input id="l_pass" name="password" type="password" required></div>
              ${error ? `<p class="err">${esc(error)}</p>` : ''}
              <button class="btn primary" type="submit">Se connecter</button>
            </form>`;

                $('login').onsubmit = async (e) => {
                    e.preventDefault();
                    const btn = e.target.querySelector('button');
                    btn.disabled = true;
                    try {
                        await login(
                            e.target.email.value,
                            e.target.password.value,
                        );
                    } catch (err) {
                        btn.disabled = false;
                        renderLogin(err.message);
                    }
                };
            }

            async function renderApp() {
                if (!me) {
                    try {
                        me = (await api('/auth/me')).data;
                    } catch {
                        return renderLogin();
                    }
                }

                let group = null;
                const links = Object.entries(RESOURCES)
                    .map(([k, r]) => {
                        const header =
                            r.group === group
                                ? ''
                                : `<div class="group">${esc(r.group)}</div>`;
                        group = r.group;
                        return `${header}<a href="#${k}" class="${
                            k === state.key ? 'active' : ''
                        }">${esc(r.label)}</a>`;
                    })
                    .join('');

                root.innerHTML = `
            <div id="app">
              <nav>
                <div class="brand">Foursquare CI</div>
                ${links}
                <div class="spacer"></div>
                <div class="me"><strong>${esc(me.name)}</strong>${esc(me.role)}</div>
                <button class="btn" id="logout">Déconnexion</button>
              </nav>
              <main id="main"></main>
            </div>`;

                $('logout').onclick = logout;
                state.editing ? renderForm() : renderList();
            }

            function renderHead(res, extra = '') {
                return `
            <div class="head">
              <h1>${esc(res.label)}</h1>
              ${res.search ? `<input id="search" type="search" placeholder="Rechercher…" value="${esc(state.search)}">` : ''}
              ${extra}
            </div>`;
            }

            function bindSearch(reload) {
                const input = $('search');
                if (!input) return;
                input.oninput = () => {
                    clearTimeout(bindSearch.timer);
                    bindSearch.timer = setTimeout(() => {
                        state.search = input.value;
                        state.page = 1;
                        reload();
                    }, 300);
                };
            }

            async function renderList() {
                const key = state.key;
                const res = RESOURCES[key];

                if (res.view === 'gallery') return renderGallery();

                $('main').innerHTML =
                    renderHead(
                        res,
                        res.noCreate
                            ? ''
                            : '<button class="btn primary" id="create">Nouveau</button>',
                    ) +
                    '<div class="body"><div class="card" id="list"><p class="empty">Chargement…</p></div></div>';

                bindSearch(renderList);

                if (!res.noCreate)
                    $('create').onclick = () => {
                        state.editing = {};
                        renderForm();
                    };

                const query =
                    `?page=${state.page}&per_page=20` +
                    (state.search
                        ? `&search=${encodeURIComponent(state.search)}`
                        : '');

                let data, meta;
                try {
                    ({ data, meta } = await api('/admin/' + key + query));
                } catch (err) {
                    $('list').innerHTML =
                        `<p class="empty">${esc(err.message)}</p>`;
                    return;
                }

                data.forEach(rememberRowMedia);

                if (!data.length) {
                    $('list').innerHTML =
                        '<p class="empty">Aucun élément pour le moment.</p>';
                    return;
                }

                const actions = res.rowActions || [];

                $('list').innerHTML = `
            <table>
              <thead><tr>${res.columns
                  .map((c) => `<th>${esc(c[1])}</th>`)
                  .join('')}<th></th></tr></thead>
              <tbody>
                ${data
                    .map(
                        (row, i) => `
                  <tr>
                    ${res.columns
                        .map(
                            (c) =>
                                `<td${c[2] === 'title' ? ' class="title"' : ''}>${cell(row, c)}</td>`,
                        )
                        .join('')}
                    <td class="acts">
                      ${actions
                          .map((a, ai) =>
                              a.show(row)
                                  ? `<button class="btn sm" data-act="${i}:${ai}">${esc(a.label)}</button> `
                                  : '',
                          )
                          .join('')}
                      <button class="btn sm" data-edit="${i}">Éditer</button>
                      <button class="btn sm danger" data-del="${i}">Supprimer</button>
                    </td>
                  </tr>`,
                    )
                    .join('')}
              </tbody>
            </table>
            <div class="pager">
              <span>${meta.total} élément(s) — page ${meta.page}/${meta.last_page}</span>
              <span class="spacer"></span>
              <button class="btn sm" id="prev" ${meta.page <= 1 ? 'disabled' : ''}>Précédent</button>
              <button class="btn sm" id="next" ${meta.page >= meta.last_page ? 'disabled' : ''}>Suivant</button>
            </div>`;

                const list = $('list');

                list.querySelectorAll('[data-act]').forEach((b) => {
                    const [i, ai] = b.dataset.act.split(':').map(Number);
                    const row = data[i];
                    const act = actions[ai];
                    b.onclick = async () => {
                        if (act.confirm && !confirm(act.confirm(row))) return;
                        b.disabled = true;
                        try {
                            await api(
                                '/admin/' +
                                    key +
                                    '/' +
                                    row.id +
                                    (act.path || ''),
                                {
                                    method: act.method || 'PATCH',
                                    body: act.patch,
                                },
                            );
                            toast(act.done);
                            renderList();
                        } catch (err) {
                            b.disabled = false;
                            toast(err.message, true);
                        }
                    };
                });

                list.querySelectorAll('[data-edit]').forEach((b) => {
                    b.onclick = async () => {
                        try {
                            state.editing = rememberRowMedia(
                                (
                                    await api(
                                        '/admin/' +
                                            key +
                                            '/' +
                                            data[b.dataset.edit].id,
                                    )
                                ).data,
                            );
                            renderForm();
                        } catch (err) {
                            toast(err.message, true);
                        }
                    };
                });

                list.querySelectorAll('[data-del]').forEach((b) => {
                    b.onclick = async () => {
                        const row = data[b.dataset.del];
                        if (!confirm(`Supprimer « ${label(row)} » ?`)) return;
                        try {
                            await api('/admin/' + key + '/' + row.id, {
                                method: 'DELETE',
                            });
                            delete refCache[key];
                            toast('Supprimé');
                            renderList();
                        } catch (err) {
                            toast(err.message, true);
                        }
                    };
                });

                $('prev').onclick = () => {
                    state.page--;
                    renderList();
                };
                $('next').onclick = () => {
                    state.page++;
                    renderList();
                };
            }

            // ------------------------------------------------- media gallery
            async function renderGallery() {
                const res = RESOURCES.media;

                $('main').innerHTML =
                    renderHead(
                        res,
                        `<label class="btn primary">Importer des images
              <input type="file" accept="${ACCEPT}" multiple hidden id="up"></label>`,
                    ) +
                    `<div class="body">
               <div class="dropzone" id="drop">Glissez des images ici, ou utilisez « Importer des images » — JPG, PNG ou WebP, 5 Mo max.</div>
               <div class="gallery" id="grid" style="margin-top:18px"><p class="empty">Chargement…</p></div>
               <div class="pager" id="gpager" hidden></div>
             </div>`;

                const grid = $('grid');

                const importFiles = async (files) => {
                    const images = [...files].filter((f) =>
                        ACCEPT.includes(f.type),
                    );
                    if (!images.length)
                        return toast('Formats acceptés : JPG, PNG, WebP', true);
                    try {
                        for (const file of images) await upload(file);
                        toast(`${images.length} image(s) importée(s)`);
                        state.page = 1;
                        renderGallery();
                    } catch (err) {
                        toast(err.message, true);
                    }
                };

                $('up').onchange = (e) => {
                    const files = e.target.files;
                    e.target.value = '';
                    importFiles(files);
                };

                const drop = $('drop');
                drop.onclick = () => $('up').click();
                drop.ondragover = (e) => {
                    e.preventDefault();
                    drop.classList.add('over');
                };
                drop.ondragleave = () => drop.classList.remove('over');
                drop.ondrop = (e) => {
                    e.preventDefault();
                    drop.classList.remove('over');
                    importFiles(e.dataTransfer.files);
                };

                let data, meta;
                try {
                    ({ data, meta } = await api(
                        `/admin/media?page=${state.page}&per_page=24`,
                    ));
                } catch (err) {
                    grid.innerHTML = `<p class="empty">${esc(err.message)}</p>`;
                    return;
                }

                data.forEach(remember);

                if (!data.length) {
                    grid.innerHTML =
                        '<p class="empty">Aucune image pour le moment.</p>';
                    return;
                }

                grid.innerHTML = data
                    .map((m) =>
                        tile(m, {
                            tools: `
                <span class="btn sm" data-copy="${esc(m.id)}">Copier l’URL</span>
                <span class="btn sm danger" data-drop="${esc(m.id)}">Supprimer</span>`,
                        }),
                    )
                    .join('');

                grid.querySelectorAll('[data-copy]').forEach((el) => {
                    el.onclick = (e) => {
                        e.stopPropagation();
                        navigator.clipboard
                            .writeText(mediaCache[el.dataset.copy].url)
                            .then(() => toast('URL copiée'))
                            .catch(() => toast('Copie impossible', true));
                    };
                });

                grid.querySelectorAll('[data-drop]').forEach((el) => {
                    el.onclick = async (e) => {
                        e.stopPropagation();
                        const m = mediaCache[el.dataset.drop];
                        if (
                            !confirm(
                                `Supprimer « ${label(m)} » ? Les contenus qui l’utilisent perdront leur image.`,
                            )
                        )
                            return;
                        try {
                            await api('/admin/media/' + m.id, {
                                method: 'DELETE',
                            });
                            delete mediaCache[m.id];
                            delete refCache.media;
                            toast('Image supprimée');
                            renderGallery();
                        } catch (err) {
                            toast(err.message, true);
                        }
                    };
                });

                // Clicking the tile itself just opens the file in a new tab.
                grid.querySelectorAll('.tile').forEach((el) => {
                    el.onclick = () =>
                        window.open(mediaCache[el.dataset.id].url, '_blank');
                });

                if (meta.last_page > 1) {
                    const pager = $('gpager');
                    pager.hidden = false;
                    pager.innerHTML = `
              <span>${meta.total} image(s) — page ${meta.page}/${meta.last_page}</span>
              <span class="spacer"></span>
              <button class="btn sm" id="gprev" ${meta.page <= 1 ? 'disabled' : ''}>Précédent</button>
              <button class="btn sm" id="gnext" ${meta.page >= meta.last_page ? 'disabled' : ''}>Suivant</button>`;
                    $('gprev').onclick = () => {
                        state.page--;
                        renderGallery();
                    };
                    $('gnext').onclick = () => {
                        state.page++;
                        renderGallery();
                    };
                }
            }

            // ----------------------------------------------------------- form
            async function renderForm(errors = {}) {
                const key = state.key;
                const res = RESOURCES[key];
                const row = state.editing;
                const isNew = !row.id;

                // Load every relation list this form needs before drawing it.
                const refs = {};
                await Promise.all(
                    res.fields
                        .filter((f) => f.type === 'ref')
                        .map(async (f) => {
                            refs[f.name] = await refOptions(f.ref);
                        }),
                );

                const values = Object.assign({}, row);
                const visible = (f) => !f.showIf || f.showIf(values);

                const draw = () => {
                    $('main').innerHTML =
                        `<div class="head"><h1>${isNew ? 'Nouveau' : 'Éditer'} — ${esc(res.label)}</h1></div>` +
                        `<div class="body"><div class="card">
                <form id="form" class="grid">
                  ${res.fields
                      .filter(visible)
                      .map((f) =>
                          field(
                              f,
                              values[f.name],
                              errors[f.name],
                              refs[f.name],
                          ),
                      )
                      .join('')}
                  <div class="actions wide">
                    <button class="btn primary" type="submit">${isNew ? 'Créer' : 'Enregistrer'}</button>
                    <button class="btn ghost" type="button" id="cancel">Annuler</button>
                  </div>
                </form>
              </div></div>`;

                    const form = $('form');

                    $('cancel').onclick = () => {
                        state.editing = null;
                        renderList();
                    };

                    bindImageFields(form, values);
                    bindRichText(form);

                    // Conditional fields follow scope_type / link_type / type / audience.
                    ['scope_type', 'link_type', 'type', 'audience'].forEach(
                        (name) => {
                            const el = form.elements[name];
                            if (!el) return;
                            el.onchange = () => {
                                Object.assign(values, collect(form, res));
                                draw();
                            };
                        },
                    );

                    form.onsubmit = async (e) => {
                        e.preventDefault();
                        const payload = {};

                        res.fields.forEach((f) => {
                            // A hidden conditional field is explicitly cleared,
                            // otherwise a stale target would survive the change.
                            if (!visible(f)) {
                                if (f.showIf) payload[f.name] = null;
                                return;
                            }

                            const el = form.elements[f.name];
                            if (!el) return;

                            if (f.type === 'checkbox')
                                payload[f.name] = el.checked;
                            else if (f.type === 'number')
                                payload[f.name] =
                                    el.value === '' ? null : Number(el.value);
                            else
                                payload[f.name] =
                                    el.value === '' ? null : el.value;
                        });

                        const btn = form.querySelector('[type=submit]');
                        btn.disabled = true;

                        try {
                            await api(
                                '/admin/' + key + (isNew ? '' : '/' + row.id),
                                {
                                    method: isNew ? 'POST' : 'PATCH',
                                    body: payload,
                                },
                            );
                            delete refCache[key];
                            state.editing = null;
                            toast(isNew ? 'Créé' : 'Enregistré');
                            renderList();
                        } catch (err) {
                            btn.disabled = false;
                            const fields = err.payload?.fields || {};
                            toast(
                                Object.keys(fields).length
                                    ? 'Corrigez les champs en rouge'
                                    : err.message,
                                true,
                            );
                            state.editing = Object.assign(
                                {},
                                values,
                                collect(form, res),
                            );
                            renderForm(fields);
                        }
                    };
                };

                draw();
            }

            function collect(form, res) {
                const out = {};
                res.fields.forEach((f) => {
                    const el = form.elements[f.name];
                    if (!el) return;
                    out[f.name] = f.type === 'checkbox' ? el.checked : el.value;
                });
                return out;
            }

            // Fill the thumbnail and wire the picker for every image field.
            function bindImageFields(form, values) {
                form.querySelectorAll('[data-image]').forEach((box) => {
                    const name = box.dataset.image;
                    const input = box.querySelector('input[type=hidden]');
                    const prev = box.querySelector('.imgprev');
                    const clear = box.querySelector('[data-clear]');

                    const paint = async () => {
                        clear.hidden = !input.value;
                        const m = await getMedia(input.value);
                        prev.innerHTML = m
                            ? `<img src="${esc(m.url)}" alt="">`
                            : '<span>Aucune image</span>';
                    };

                    box.querySelector('[data-pick]').onclick = async () => {
                        const picked = await pickMedia(input.value);
                        if (picked === undefined) return;
                        input.value = picked ? picked.id : '';
                        values[name] = input.value || null;
                        paint();
                    };

                    clear.onclick = () => {
                        input.value = '';
                        values[name] = null;
                        paint();
                    };

                    paint();
                });
            }

            // Minimal formatting helpers: wrap the selection, no editor needed.
            const TAGS = [
                ['Gras', 'strong'],
                ['Italique', 'em'],
                ['Titre', 'h2'],
                ['Paragraphe', 'p'],
                ['Liste', 'ul'],
                ['Lien', 'a'],
            ];

            function bindRichText(form) {
                form.querySelectorAll('[data-rich]').forEach((box) => {
                    const ta = box.querySelector('textarea');
                    const preview = box.querySelector('.preview');
                    const toggle = box.querySelector('[data-preview]');

                    box.querySelectorAll('[data-tag]').forEach((btn) => {
                        btn.onclick = () => {
                            const tag = btn.dataset.tag;
                            const s = ta.selectionStart;
                            const e = ta.selectionEnd;
                            const sel = ta.value.slice(s, e) || 'texte';

                            const html =
                                tag === 'ul'
                                    ? `<ul>\n  <li>${sel}</li>\n</ul>`
                                    : tag === 'a'
                                      ? `<a href="https://">${sel}</a>`
                                      : `<${tag}>${sel}</${tag}>`;

                            ta.setRangeText(html, s, e, 'end');
                            ta.focus();
                        };
                    });

                    toggle.onclick = () => {
                        const showing = !preview.hidden;
                        preview.hidden = showing;
                        ta.hidden = !showing;
                        toggle.textContent = showing ? 'Aperçu' : 'Éditer';
                        if (!showing) preview.innerHTML = ta.value;
                    };
                });
            }

            // ---------------------------------------------------------- field
            function field(f, value, error, options) {
                const err = error ? `<p class="err">${esc(error[0])}</p>` : '';
                const hint = f.hint ? `<p class="hint">${esc(f.hint)}</p>` : '';
                const wide =
                    f.wide || f.type === 'textarea' || f.type === 'richtext'
                        ? ' wide'
                        : '';
                const id = 'f_' + f.name;
                const req = f.required ? 'required' : '';
                const lbl = `<label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>`;

                if (f.type === 'checkbox')
                    return `<div class="field${wide}"><div class="check">
              <input type="checkbox" name="${f.name}" id="${id}" ${value ? 'checked' : ''}>
              <label for="${id}">${esc(f.label)}</label></div>${hint}${err}</div>`;

                if (f.type === 'image')
                    return `<div class="field${wide}" data-image="${f.name}">
              ${lbl}
              <div class="imgfield">
                <div class="imgprev"><span>Aucune image</span></div>
                <div class="imgacts">
                  <button type="button" class="btn" data-pick>Choisir une image</button>
                  <button type="button" class="btn ghost" data-clear hidden>Retirer</button>
                  <p class="hint">JPG, PNG ou WebP — 5 Mo max. L’import se fait depuis la fenêtre de sélection.</p>
                </div>
              </div>
              <input type="hidden" name="${f.name}" value="${esc(value)}">
              ${err}</div>`;

                if (f.type === 'richtext')
                    return `<div class="field${wide}" data-rich>
              ${lbl}
              <div class="toolbar">
                ${TAGS.map(
                    ([text, tag]) =>
                        `<button type="button" class="btn" data-tag="${tag}">${text}</button>`,
                ).join('')}
                <button type="button" class="btn ghost" data-preview>Aperçu</button>
              </div>
              <textarea name="${f.name}" id="${id}" rows="12" ${req}>${esc(value)}</textarea>
              <div class="preview" hidden></div>
              <p class="hint">HTML limité : p, br, strong, em, u, ul, ol, li, h2-h4, blockquote, a. Le reste est retiré à l’enregistrement.</p>
              ${err}</div>`;

                if (f.type === 'select')
                    return `<div class="field${wide}">${lbl}
              <select name="${f.name}" id="${id}" ${req}>
                ${f.required ? '' : '<option value="">—</option>'}
                ${f.options
                    .map(
                        (o) =>
                            `<option ${o === value ? 'selected' : ''}>${esc(o)}</option>`,
                    )
                    .join('')}
              </select>${hint}${err}</div>`;

                if (f.type === 'ref')
                    return `<div class="field${wide}">${lbl}
              <select name="${f.name}" id="${id}" ${req}>
                <option value="">—</option>
                ${(options || [])
                    .map(
                        (o) =>
                            `<option value="${esc(o.id)}" ${o.id === value ? 'selected' : ''}>${esc(o.label)}</option>`,
                    )
                    .join('')}
              </select>${hint}${err}</div>`;

                if (f.type === 'textarea')
                    return `<div class="field${wide}">${lbl}
              <textarea name="${f.name}" id="${id}" rows="${f.rows || 4}" ${req}>${esc(value)}</textarea>${hint}${err}</div>`;

                const v =
                    f.type === 'datetime-local' && value
                        ? String(value).slice(0, 16)
                        : value;

                return `<div class="field${wide}">${lbl}
              <input name="${f.name}" id="${id}" type="${f.type || 'text'}" ${
                  f.type === 'number' ? 'step="any"' : ''
              } value="${esc(v)}" ${req}>${hint}${err}</div>`;
            }

            // ----------------------------------------------------------- boot
            window.onhashchange = () => {
                const key = location.hash.slice(1);
                if (RESOURCES[key]) {
                    state = { key, page: 1, search: '', editing: null };
                    renderApp();
                }
            };

            const initial = location.hash.slice(1);
            if (RESOURCES[initial]) state.key = initial;

            token ? renderApp() : renderLogin();
        </script>
    </body>
</html>
