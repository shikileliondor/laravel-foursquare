<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Foursquare CI — Administration</title>
        <style>
            :root {
                color-scheme: light dark;
                --red: #e31e2d;
                --blue: #2449b8;
                --gold: #f2b705;
                --purple: #7e2a8c;
                --green: #1fa855;
                --navy: #0e1a3d;
                --navy-2: #16244f;

                --bg: #f4f6fb;
                --surface: #fff;
                --surface-2: #f7f8fc;
                --surface-3: #eef1f7;
                --line: #e4e8f0;
                --line-strong: #cfd6e3;
                --text: #0e1630;
                --text-2: #3b4459;
                --muted: #6b7489;
                --accent: #2449b8;
                --accent-soft: #e8eefc;
                --on-accent: #fff;
                --ok: #157a3e;
                --ok-bg: #e3f6ea;
                --warn: #8a5a00;
                --warn-bg: #fff4d1;
                --bad: #c0182a;
                --bad-bg: #fde8ea;
                --info: #2449b8;
                --info-bg: #e8eefc;
                --radius: 10px;
                --radius-lg: 14px;
                --shadow-sm: 0 1px 2px rgb(14 22 48 / 6%);
                --shadow:
                    0 1px 2px rgb(14 22 48 / 5%), 0 6px 20px rgb(14 22 48 / 6%);
                --shadow-lg: 0 24px 60px rgb(14 22 48 / 22%);
                --side: 264px;
                --font:
                    'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI',
                    sans-serif;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0b1020;
                    --surface: #121a2e;
                    --surface-2: #161f37;
                    --surface-3: #1d2742;
                    --line: #24304d;
                    --line-strong: #34425f;
                    --text: #e8ecf6;
                    --text-2: #c2c9da;
                    --muted: #8a94ab;
                    --accent: #6d8ff0;
                    --accent-soft: #1b2850;
                    --ok: #5fd08a;
                    --ok-bg: #10291c;
                    --warn: #f2c14e;
                    --warn-bg: #2c2410;
                    --bad: #ff7b86;
                    --bad-bg: #33141a;
                    --info: #8ea9ff;
                    --info-bg: #1b2850;
                    --shadow-sm: none;
                    --shadow: none;
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font: 14px/1.55 var(--font);
                -webkit-font-smoothing: antialiased;
            }

            h1,
            h2,
            h3,
            p {
                margin: 0;
            }

            h1,
            h2,
            h3 {
                letter-spacing: -0.015em;
            }

            a {
                color: var(--accent);
            }

            img {
                display: block;
                max-width: 100%;
            }

            :focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            .i {
                width: 18px;
                height: 18px;
                flex: none;
            }

            /* Sinon `.btn { display: inline-flex }` l'emporte sur l'attribut. */
            [hidden] {
                display: none !important;
            }

            .sr {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
            }

            .fourbar {
                display: flex;
                height: 4px;
                border-radius: 4px;
                overflow: hidden;
            }

            .fourbar i {
                flex: 1;
            }

            .fourbar i:nth-child(1) {
                background: var(--red);
            }
            .fourbar i:nth-child(2) {
                background: var(--blue);
            }
            .fourbar i:nth-child(3) {
                background: var(--gold);
            }
            .fourbar i:nth-child(4) {
                background: var(--purple);
            }

            /* ------------------------------------------------------ controls */
            button {
                font: inherit;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
                height: 38px;
                margin: 0;
                padding: 0 15px;
                border: 1px solid var(--line-strong);
                border-radius: var(--radius);
                background: var(--surface);
                color: var(--text);
                font-size: 13.5px;
                font-weight: 600;
                letter-spacing: normal;
                text-decoration: none;
                cursor: pointer;
                white-space: nowrap;
                transition:
                    background 0.15s,
                    border-color 0.15s,
                    box-shadow 0.15s,
                    color 0.15s;
            }

            .btn .i {
                width: 16px;
                height: 16px;
            }

            .btn:hover:not(:disabled) {
                background: var(--surface-3);
            }

            .btn.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: var(--on-accent);
                box-shadow:
                    0 1px 2px rgb(36 73 184 / 25%),
                    0 4px 12px rgb(36 73 184 / 18%);
            }

            .btn.primary:hover:not(:disabled) {
                background: var(--accent);
                filter: brightness(1.08);
            }

            .btn.ghost {
                border-color: transparent;
                background: transparent;
                color: var(--muted);
            }

            .btn.ghost:hover:not(:disabled) {
                color: var(--text);
                background: var(--surface-3);
            }

            .btn.danger {
                color: var(--bad);
            }

            .btn.danger:hover:not(:disabled) {
                background: var(--bad-bg);
                border-color: transparent;
            }

            .btn.light {
                border-color: #fff;
                background: #fff;
                color: var(--navy);
            }

            .btn.light:hover:not(:disabled) {
                background: #eef1f7;
            }

            .btn.sm {
                height: 31px;
                padding: 0 11px;
                font-size: 12.5px;
                border-radius: 8px;
            }

            .btn:disabled {
                opacity: 0.5;
                cursor: default;
            }

            .iconbtn {
                display: inline-grid;
                place-items: center;
                width: 34px;
                height: 34px;
                padding: 0;
                border: 1px solid transparent;
                border-radius: 9px;
                background: transparent;
                color: var(--muted);
                cursor: pointer;
                transition:
                    background 0.15s,
                    color 0.15s;
            }

            .iconbtn .i {
                width: 17px;
                height: 17px;
            }

            .iconbtn:hover:not(:disabled) {
                background: var(--surface-3);
                color: var(--text);
            }

            .iconbtn.danger:hover:not(:disabled) {
                background: var(--bad-bg);
                color: var(--bad);
            }

            .iconbtn:disabled {
                opacity: 0.35;
                cursor: default;
            }

            input,
            select,
            textarea {
                width: 100%;
                min-height: 40px;
                padding: 8px 12px;
                border: 1px solid var(--line-strong);
                border-radius: var(--radius);
                background: var(--surface);
                color: var(--text);
                font: inherit;
                transition:
                    border-color 0.15s,
                    box-shadow 0.15s;
            }

            input:hover,
            select:hover,
            textarea:hover {
                border-color: color-mix(
                    in srgb,
                    var(--accent) 35%,
                    var(--line-strong)
                );
            }

            input:focus,
            select:focus,
            textarea:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 4px
                    color-mix(in srgb, var(--accent) 16%, transparent);
            }

            textarea {
                min-height: 130px;
                line-height: 1.6;
                resize: vertical;
            }

            label {
                display: block;
                margin-bottom: 6px;
                color: var(--text-2);
                font-size: 12.5px;
                font-weight: 600;
            }

            .req {
                color: var(--red);
            }

            .hint {
                margin: 6px 0 0;
                color: var(--muted);
                font-size: 12px;
            }

            .err {
                margin: 6px 0 0;
                color: var(--bad);
                font-size: 12px;
                font-weight: 600;
            }

            .field.has-err input,
            .field.has-err select,
            .field.has-err textarea {
                border-color: var(--bad);
            }

            /* --------------------------------------------------------- badge */
            .badge {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 3px 10px;
                border-radius: 999px;
                background: var(--surface-3);
                color: var(--text-2);
                font-size: 12px;
                font-weight: 600;
                line-height: 1.45;
                white-space: nowrap;
            }

            .badge.dot::before {
                content: '';
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: currentColor;
            }

            .badge.ok {
                background: var(--ok-bg);
                color: var(--ok);
            }

            .badge.warn {
                background: var(--warn-bg);
                color: var(--warn);
            }

            .badge.bad {
                background: var(--bad-bg);
                color: var(--bad);
            }

            .badge.info {
                background: var(--info-bg);
                color: var(--info);
            }

            .muted-sm {
                color: var(--muted);
                font-size: 12.5px;
                white-space: nowrap;
            }

            /* --------------------------------------------------------- login */
            .login {
                display: grid;
                grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
                min-height: 100vh;
            }

            .login-brand {
                position: relative;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 22px;
                padding: 56px clamp(32px, 6vw, 88px);
                background:
                    radial-gradient(
                        circle at 15% 10%,
                        rgb(36 73 184 / 55%),
                        transparent 45%
                    ),
                    radial-gradient(
                        circle at 90% 90%,
                        rgb(126 42 140 / 45%),
                        transparent 45%
                    ),
                    var(--navy);
                color: #fff;
                overflow: hidden;
            }

            .login-brand img {
                width: 96px;
                height: 96px;
                padding: 6px;
                border-radius: 22px;
                background: #fff;
                box-shadow: 0 18px 40px rgb(0 0 0 / 30%);
            }

            .login-brand h1 {
                font-size: clamp(28px, 3.4vw, 40px);
                font-weight: 700;
                line-height: 1.15;
            }

            .login-brand p {
                max-width: 420px;
                color: #c3cbe4;
                font-size: 15px;
            }

            .login-brand .fourbar {
                width: 160px;
            }

            .login-main {
                display: grid;
                place-items: center;
                padding: 40px 24px;
            }

            #login {
                width: min(400px, 100%);
            }

            #login h2 {
                font-size: 24px;
                font-weight: 700;
            }

            #login > p {
                margin: 6px 0 28px;
                color: var(--muted);
            }

            #login .field {
                margin-bottom: 16px;
            }

            #login .btn {
                width: 100%;
                height: 44px;
                margin-top: 6px;
            }

            .alert {
                display: flex;
                align-items: center;
                gap: 9px;
                margin-bottom: 16px;
                padding: 10px 12px;
                border-radius: var(--radius);
                background: var(--bad-bg);
                color: var(--bad);
                font-size: 13px;
                font-weight: 600;
            }

            /* --------------------------------------------------------- shell */
            #app {
                display: grid;
                grid-template-columns: var(--side) minmax(0, 1fr);
                min-height: 100vh;
            }

            .side {
                position: sticky;
                top: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
                padding: 20px 14px 14px;
                background: var(--navy);
                color: #c4cce6;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: #2a3a6a transparent;
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 0 8px;
            }

            .brand img {
                width: 42px;
                height: 42px;
                padding: 3px;
                border-radius: 11px;
                background: #fff;
            }

            .brand strong {
                display: block;
                color: #fff;
                font-size: 15px;
                font-weight: 700;
            }

            .brand span {
                color: #8d99c2;
                font-size: 12px;
            }

            .side .fourbar {
                margin: 18px 8px 6px;
                height: 3px;
                opacity: 0.9;
            }

            .side h6 {
                margin: 20px 10px 6px;
                color: #7783ad;
                font-size: 10.5px;
                font-weight: 700;
                letter-spacing: 0.09em;
                text-transform: uppercase;
            }

            .side a {
                position: relative;
                display: flex;
                align-items: center;
                gap: 11px;
                margin: 1px 0;
                padding: 9px 10px;
                border-radius: 10px;
                color: #c4cce6;
                font-size: 13.5px;
                font-weight: 500;
                text-decoration: none;
                transition:
                    background 0.15s,
                    color 0.15s;
            }

            .side a .i {
                opacity: 0.8;
            }

            .side a:hover {
                background: rgb(255 255 255 / 6%);
                color: #fff;
            }

            .side a.active {
                background: rgb(255 255 255 / 11%);
                color: #fff;
                font-weight: 600;
            }

            .side a.active .i {
                opacity: 1;
                color: var(--gold);
            }

            .side a.active::before {
                content: '';
                position: absolute;
                top: 9px;
                bottom: 9px;
                left: -14px;
                width: 3px;
                border-radius: 0 3px 3px 0;
                background: var(--red);
            }

            .side .user {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-top: auto;
                padding: 10px;
                border-radius: 12px;
                background: rgb(255 255 255 / 6%);
            }

            .side .grow {
                flex: 1;
                min-height: 18px;
            }

            .avatar {
                display: grid;
                place-items: center;
                width: 36px;
                height: 36px;
                flex: none;
                border-radius: 50%;
                background: linear-gradient(135deg, var(--red), var(--purple));
                color: #fff;
                font-size: 13px;
                font-weight: 700;
            }

            .who {
                flex: 1;
                min-width: 0;
            }

            .who strong,
            .who span {
                display: block;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .who strong {
                color: #fff;
                font-size: 13px;
            }

            .who span {
                color: #8d99c2;
                font-size: 11.5px;
            }

            .side .iconbtn {
                color: #8d99c2;
            }

            .side .iconbtn:hover {
                background: rgb(255 255 255 / 10%);
                color: #fff;
            }

            .scrim {
                display: none;
            }

            main {
                min-width: 0;
            }

            .topbar {
                position: sticky;
                top: 0;
                z-index: 6;
                display: flex;
                align-items: center;
                gap: 14px;
                min-height: 78px;
                padding: 16px 32px;
                background: color-mix(in srgb, var(--bg) 86%, transparent);
                backdrop-filter: blur(12px);
            }

            .topbar .titles {
                flex: 1;
                min-width: 0;
            }

            .topbar h1 {
                overflow: hidden;
                font-size: 22px;
                font-weight: 700;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .topbar p {
                margin-top: 2px;
                color: var(--muted);
                font-size: 13px;
            }

            .topbar .acts {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }

            .menu-btn {
                display: none;
            }

            .tabs {
                display: flex;
                gap: 6px;
                margin: 0 32px;
                border-bottom: 1px solid var(--line);
                overflow-x: auto;
            }

            .tabs a {
                margin-bottom: -1px;
                padding: 10px 12px;
                border-bottom: 2px solid transparent;
                color: var(--muted);
                font-size: 13.5px;
                font-weight: 600;
                text-decoration: none;
                white-space: nowrap;
            }

            .tabs a:hover {
                color: var(--text);
            }

            .tabs a.active {
                border-bottom-color: var(--accent);
                color: var(--accent);
            }

            .body {
                padding: 22px 32px 56px;
            }

            .card {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-sm);
                overflow: hidden;
            }

            .card-head {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 16px 18px;
                border-bottom: 1px solid var(--line);
            }

            .card-head h2 {
                display: flex;
                align-items: center;
                gap: 8px;
                flex: 1;
                font-size: 15px;
                font-weight: 700;
            }

            .card-head a {
                font-size: 13px;
                font-weight: 600;
                text-decoration: none;
            }

            /* ---------------------------------------------- states & loading */
            .empty {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                padding: 56px 20px;
                color: var(--muted);
                text-align: center;
            }

            .empty .i {
                width: 40px;
                height: 40px;
                margin-bottom: 6px;
                padding: 9px;
                border-radius: 12px;
                background: var(--surface-3);
                color: var(--muted);
            }

            .empty strong {
                color: var(--text);
                font-size: 15px;
            }

            .empty .btn {
                margin-top: 10px;
            }

            .skel {
                padding: 6px 0;
            }

            .sk-row {
                display: grid;
                grid-template-columns: 2fr 1fr 1fr 0.6fr;
                gap: 20px;
                padding: 17px 18px;
                border-bottom: 1px solid var(--line);
            }

            .sk-row:last-child {
                border-bottom: 0;
            }

            .sk-row span,
            .sk-block {
                display: block;
                height: 12px;
                border-radius: 6px;
                background: linear-gradient(
                    90deg,
                    var(--surface-3),
                    var(--surface-2),
                    var(--surface-3)
                );
                background-size: 200% 100%;
                animation: shimmer 1.2s infinite linear;
            }

            @keyframes shimmer {
                to {
                    background-position: -200% 0;
                }
            }

            /* --------------------------------------------------------- table */
            .listbar {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 14px 16px;
                border-bottom: 1px solid var(--line);
            }

            .searchbox {
                position: relative;
                flex: 0 1 340px;
            }

            .searchbox .i {
                position: absolute;
                top: 50%;
                left: 12px;
                width: 16px;
                height: 16px;
                color: var(--muted);
                transform: translateY(-50%);
                pointer-events: none;
            }

            .searchbox input {
                padding-left: 37px;
                background: var(--surface-2);
            }

            .listbar .total {
                margin-left: auto;
                color: var(--muted);
                font-size: 13px;
            }

            .tablewrap {
                overflow-x: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                padding: 12px 16px;
                border-bottom: 1px solid var(--line);
                text-align: left;
                vertical-align: middle;
            }

            tr:last-child td {
                border-bottom: 0;
            }

            th {
                background: var(--surface-2);
                color: var(--muted);
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                white-space: nowrap;
            }

            tbody tr {
                transition: background 0.12s;
            }

            tbody tr:hover {
                background: var(--surface-2);
            }

            td.title {
                color: var(--text);
                font-weight: 600;
            }

            td.acts {
                width: 1%;
                text-align: right;
                white-space: nowrap;
            }

            .rowacts {
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }

            .rowthumb {
                width: 56px;
                height: 40px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--surface-3);
                overflow: hidden;
            }

            .rowthumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .excerpt {
                display: block;
                min-width: 220px;
                max-width: 360px;
                color: var(--muted);
                font-size: 13px;
            }

            .daycell {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                white-space: nowrap;
            }

            .pager {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 12px 16px;
                border-top: 1px solid var(--line);
                color: var(--muted);
                font-size: 13px;
            }

            .pager .spacer {
                flex: 1;
            }

            /* ------------------------------------------------------- gallery */
            .gallery {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }

            .tile {
                position: relative;
                display: block;
                width: 100%;
                padding: 0;
                border: 1px solid var(--line);
                border-radius: 12px;
                background: var(--surface);
                overflow: hidden;
                cursor: pointer;
                text-align: left;
                transition:
                    border-color 0.15s,
                    box-shadow 0.15s,
                    transform 0.15s;
            }

            .tile img {
                width: 100%;
                aspect-ratio: 4 / 3;
                object-fit: cover;
                background: var(--surface-3);
            }

            .tile .name {
                display: block;
                padding: 8px 10px;
                overflow: hidden;
                color: var(--muted);
                font-size: 12px;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .tile:hover {
                border-color: var(--line-strong);
                box-shadow: var(--shadow);
                transform: translateY(-1px);
            }

            .tile[aria-pressed='true'] {
                border-color: var(--accent);
                box-shadow: 0 0 0 2px var(--accent);
            }

            .tile .tools {
                position: absolute;
                inset: auto 8px 40px auto;
                display: flex;
                gap: 6px;
                opacity: 0;
                transition: opacity 0.15s;
            }

            .tile:hover .tools,
            .tile:focus-within .tools {
                opacity: 1;
            }

            .tools .btn {
                height: 28px;
                padding: 0 9px;
                font-size: 12px;
                box-shadow: var(--shadow);
            }

            .dropzone {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                min-height: 140px;
                padding: 20px;
                border: 1.5px dashed var(--line-strong);
                border-radius: var(--radius-lg);
                background: var(--surface);
                color: var(--muted);
                text-align: center;
                font-size: 13px;
                cursor: pointer;
                transition:
                    border-color 0.15s,
                    color 0.15s,
                    background 0.15s;
            }

            .dropzone .i {
                width: 28px;
                height: 28px;
            }

            .dropzone strong {
                color: var(--text);
                font-size: 14px;
            }

            .dropzone:hover,
            .dropzone.over {
                border-color: var(--accent);
                background: var(--accent-soft);
                color: var(--accent);
            }

            /* ----------------------------------------------------- dashboard */
            .stats {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 16px;
                margin-bottom: 22px;
            }

            .stat {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 18px;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background: var(--surface);
                box-shadow: var(--shadow-sm);
                color: inherit;
                text-decoration: none;
                transition:
                    border-color 0.15s,
                    box-shadow 0.15s,
                    transform 0.15s;
            }

            a.stat:hover {
                border-color: var(--line-strong);
                box-shadow: var(--shadow);
                transform: translateY(-1px);
            }

            .stat strong {
                display: block;
                font-size: 26px;
                font-weight: 700;
                line-height: 1.15;
            }

            .stat span {
                color: var(--muted);
                font-size: 13px;
            }

            .tone {
                display: grid;
                place-items: center;
                width: 44px;
                height: 44px;
                flex: none;
                border-radius: 12px;
                background: color-mix(in srgb, var(--tone) 13%, transparent);
                color: var(--tone);
            }

            .tone .i {
                width: 21px;
                height: 21px;
            }

            .tone.sm {
                width: 36px;
                height: 36px;
                border-radius: 10px;
            }

            .tone.sm .i {
                width: 17px;
                height: 17px;
            }

            .t-red {
                --tone: var(--red);
            }
            .t-blue {
                --tone: var(--blue);
            }
            .t-gold {
                --tone: #c58f00;
            }
            .t-purple {
                --tone: var(--purple);
            }
            .t-green {
                --tone: var(--green);
            }
            .t-navy {
                --tone: #3a4d8f;
            }

            @media (prefers-color-scheme: dark) {
                .t-blue,
                .t-navy {
                    --tone: #8ea9ff;
                }
                .t-purple {
                    --tone: #d48ae0;
                }
                .t-red {
                    --tone: #ff7b86;
                }
                .t-gold {
                    --tone: var(--gold);
                }
            }

            .dash-grid {
                display: grid;
                grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr);
                gap: 20px;
                align-items: start;
            }

            .col {
                display: grid;
                gap: 20px;
            }

            .feed {
                margin: 0;
                padding: 6px 0;
                list-style: none;
            }

            .feed li {
                display: flex;
                align-items: center;
                gap: 13px;
                padding: 11px 18px;
            }

            .feed li + li {
                border-top: 1px solid var(--line);
            }

            .feed .txt {
                flex: 1;
                min-width: 0;
            }

            .feed strong {
                display: block;
                overflow: hidden;
                font-weight: 600;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .feed .txt span {
                color: var(--muted);
                font-size: 12.5px;
            }

            .quick {
                display: flex;
                align-items: center;
                gap: 12px;
                width: 100%;
                padding: 12px 18px;
                border: 0;
                border-top: 1px solid var(--line);
                background: transparent;
                color: var(--text);
                font-weight: 600;
                text-align: left;
                cursor: pointer;
                transition: background 0.12s;
            }

            .quick:first-child {
                border-top: 0;
            }

            .quick:hover {
                background: var(--surface-2);
            }

            .quick .label {
                flex: 1;
            }

            .quick > .i:last-child {
                width: 16px;
                height: 16px;
                color: var(--muted);
            }

            .med-body {
                display: grid;
                gap: 8px;
                padding: 16px 18px;
            }

            .med-title {
                font-size: 15px;
            }

            .med-body p {
                color: var(--text-2);
                font-size: 13.5px;
            }

            .med-body .verse-foot {
                margin-top: 6px;
            }

            .med-sched {
                display: flex;
                align-items: center;
                gap: 7px;
                margin-top: 6px;
                padding-top: 12px;
                border-top: 1px solid var(--line);
                color: var(--muted);
                font-size: 12.5px;
            }

            .med-sched .i {
                width: 15px;
                height: 15px;
            }

            /* ------------------------------------------------- verse visuals */
            .verse-card {
                position: relative;
                padding: 22px;
                border-radius: var(--radius-lg);
                background:
                    radial-gradient(
                        circle at 100% 0%,
                        rgb(126 42 140 / 55%),
                        transparent 55%
                    ),
                    linear-gradient(140deg, var(--navy), #1f3375);
                color: #fff;
                overflow: hidden;
            }

            .verse-card::after {
                content: '\201C';
                position: absolute;
                top: -28px;
                right: 14px;
                color: rgb(255 255 255 / 8%);
                font:
                    700 150px/1 Georgia,
                    serif;
                pointer-events: none;
            }

            .verse-top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }

            .eyebrow {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                color: var(--gold);
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.09em;
                text-transform: uppercase;
            }

            .eyebrow .i {
                width: 15px;
                height: 15px;
            }

            .link-light {
                position: relative;
                z-index: 1;
                color: #c3cbe4;
                font-size: 12.5px;
                font-weight: 600;
                text-decoration: none;
            }

            .link-light:hover {
                color: #fff;
            }

            .verse-card blockquote {
                position: relative;
                margin: 14px 0 12px;
                font-size: 16px;
                font-weight: 500;
                line-height: 1.6;
                white-space: pre-line;
            }

            .verse-ref {
                color: #c3cbe4;
                font-size: 13px;
            }

            .verse-ref strong {
                color: #fff;
            }

            .verse-foot {
                position: relative;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px;
                margin-top: 16px;
            }

            .verse-empty {
                margin: 14px 0;
                color: #c3cbe4;
            }

            .verse-sched {
                display: flex;
                align-items: center;
                gap: 7px;
                margin-top: 16px;
                padding-top: 14px;
                border-top: 1px solid rgb(255 255 255 / 12%);
                color: #c3cbe4;
                font-size: 12.5px;
            }

            .verse-sched .i {
                width: 15px;
                height: 15px;
            }

            .verse-card .badge {
                background: rgb(255 255 255 / 12%);
                color: #fff;
            }

            .verse-card .badge.ok {
                background: rgb(31 168 85 / 28%);
                color: #c4f5d6;
            }

            .verse-card .badge.bad {
                background: rgb(227 30 45 / 30%);
                color: #ffd0d4;
            }

            .verse-card .badge.warn {
                background: rgb(242 183 5 / 25%);
                color: #ffe9a8;
            }

            .push {
                display: flex;
                gap: 12px;
                padding: 13px 14px;
                border: 1px solid var(--line);
                border-radius: 16px;
                background: var(--surface-2);
                box-shadow: var(--shadow-sm);
            }

            .push img {
                width: 34px;
                height: 34px;
                flex: none;
                padding: 2px;
                border-radius: 9px;
                background: #fff;
            }

            .push-body {
                min-width: 0;
                flex: 1;
            }

            .push-meta {
                display: flex;
                justify-content: space-between;
                color: var(--muted);
                font-size: 11.5px;
            }

            .push strong {
                display: block;
                margin-top: 2px;
                font-size: 13.5px;
            }

            .push p {
                display: -webkit-box;
                margin-top: 2px;
                overflow: hidden;
                color: var(--text-2);
                font-size: 13px;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 4;
            }

            .note {
                display: flex;
                gap: 9px;
                padding: 11px 13px;
                border-radius: var(--radius);
                background: var(--surface-3);
                color: var(--text-2);
                font-size: 12.5px;
                font-weight: 500;
            }

            .note .i {
                width: 16px;
                height: 16px;
                margin-top: 1px;
            }

            .note.info {
                background: var(--info-bg);
                color: var(--info);
            }

            .note.ok {
                background: var(--ok-bg);
                color: var(--ok);
            }

            .note.warn {
                background: var(--warn-bg);
                color: var(--warn);
            }

            /* ---------------------------------------------------------- form */
            .form-layout {
                display: grid;
                gap: 20px;
                align-items: start;
            }

            .form-layout.has-preview {
                grid-template-columns: minmax(0, 1fr) 360px;
            }

            .form-card {
                overflow: visible;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 18px 20px;
                padding: 24px;
            }

            .grid .wide {
                grid-column: 1 / -1;
            }

            .fsec {
                grid-column: 1 / -1;
                display: flex;
                align-items: center;
                gap: 10px;
                margin-top: 8px;
                padding-top: 20px;
                border-top: 1px solid var(--line);
                color: var(--text);
                font-size: 14px;
                font-weight: 700;
            }

            .fsec::before {
                content: '';
                width: 4px;
                height: 16px;
                border-radius: 4px;
                background: var(--accent);
            }

            .grid > .fsec:first-child {
                margin-top: 0;
                padding-top: 0;
                border-top: 0;
            }

            .check {
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 40px;
                padding: 9px 12px;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: var(--surface-2);
            }

            .check input {
                position: relative;
                width: 38px;
                min-height: 0;
                height: 22px;
                flex: none;
                padding: 0;
                border: 0;
                border-radius: 999px;
                background: var(--line-strong);
                cursor: pointer;
                appearance: none;
                transition: background 0.15s;
            }

            .check input::before {
                content: '';
                position: absolute;
                top: 3px;
                left: 3px;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: #fff;
                box-shadow: 0 1px 3px rgb(0 0 0 / 25%);
                transition: transform 0.15s;
            }

            .check input:checked {
                background: var(--accent);
            }

            .check input:checked::before {
                transform: translateX(16px);
            }

            .check label {
                margin: 0;
                color: var(--text);
                font-size: 13.5px;
                font-weight: 500;
                cursor: pointer;
            }

            .actions {
                position: sticky;
                bottom: 0;
                z-index: 2;
                grid-column: 1 / -1;
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 6px -24px -24px;
                padding: 14px 24px;
                border-top: 1px solid var(--line);
                border-radius: 0 0 var(--radius-lg) var(--radius-lg);
                background: color-mix(in srgb, var(--surface) 92%, transparent);
                backdrop-filter: blur(8px);
            }

            .actions .spacer {
                flex: 1;
            }

            .preview-card {
                position: sticky;
                top: 92px;
                display: grid;
                gap: 12px;
                padding: 18px;
            }

            .pv-head {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 700;
            }

            .pv-label {
                margin-top: 4px;
                color: var(--muted);
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.07em;
                text-transform: uppercase;
            }

            .preview-card .verse-card {
                padding: 18px;
            }

            .preview-card .verse-card blockquote {
                font-size: 14.5px;
            }

            /* image field */
            .imgfield {
                display: flex;
                align-items: flex-start;
                gap: 16px;
            }

            .imgprev {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 180px;
                height: 124px;
                flex: none;
                border: 1px dashed var(--line-strong);
                border-radius: 12px;
                background: var(--surface-2);
                color: var(--muted);
                font-size: 12px;
                overflow: hidden;
            }

            .imgprev img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .imgacts {
                display: flex;
                flex-wrap: wrap;
                align-items: flex-start;
                gap: 8px;
            }

            .imgacts .hint {
                width: 100%;
            }

            /* rich text */
            .toolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                margin-bottom: 8px;
                padding: 5px;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: var(--surface-2);
            }

            .toolbar .btn {
                height: 28px;
                padding: 0 10px;
                border-color: transparent;
                background: transparent;
                font-size: 12.5px;
            }

            .toolbar .btn:hover {
                background: var(--surface);
            }

            .toolbar [data-preview] {
                margin-left: auto;
            }

            .preview {
                min-height: 130px;
                padding: 14px 16px;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: var(--surface-2);
            }

            .preview > :first-child {
                margin-top: 0;
            }

            .preview > :last-child {
                margin-bottom: 0;
            }

            /* --------------------------------------------------------- modal */
            .overlay {
                position: fixed;
                inset: 0;
                z-index: 40;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                background: rgb(9 14 30 / 55%);
                backdrop-filter: blur(3px);
            }

            .modal {
                display: flex;
                flex-direction: column;
                width: min(900px, 100%);
                max-height: min(680px, 100%);
                border: 1px solid var(--line);
                border-radius: 18px;
                background: var(--bg);
                box-shadow: var(--shadow-lg);
                overflow: hidden;
            }

            .modal header,
            .modal footer {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 14px 18px;
                background: var(--surface);
            }

            .modal header {
                border-bottom: 1px solid var(--line);
            }

            .modal footer {
                border-top: 1px solid var(--line);
            }

            .modal header h2 {
                flex: 1;
                font-size: 16px;
            }

            .modal .content {
                flex: 1;
                padding: 18px;
                overflow: auto;
            }

            .modal footer .spacer {
                flex: 1;
            }

            .modal footer span {
                color: var(--muted);
                font-size: 13px;
            }

            /* --------------------------------------------------------- toast */
            #toast {
                position: fixed;
                right: 22px;
                bottom: 22px;
                z-index: 50;
                display: flex;
                align-items: flex-start;
                gap: 10px;
                max-width: 380px;
                padding: 13px 16px;
                border: 1px solid var(--line);
                border-radius: 12px;
                background: var(--surface);
                box-shadow: var(--shadow-lg);
                font-weight: 500;
                opacity: 0;
                pointer-events: none;
                transform: translateY(10px);
                transition:
                    opacity 0.2s,
                    transform 0.2s;
            }

            #toast.show {
                opacity: 1;
                pointer-events: auto;
                transform: none;
            }

            #toast .i {
                margin-top: 1px;
                color: var(--ok);
            }

            #toast.bad .i {
                color: var(--bad);
            }

            /* ---------------------------------------------------- responsive */
            @media (max-width: 1180px) {
                .dash-grid,
                .form-layout.has-preview {
                    grid-template-columns: minmax(0, 1fr);
                }

                .preview-card {
                    position: static;
                }
            }

            @media (max-width: 960px) {
                #app {
                    grid-template-columns: minmax(0, 1fr);
                }

                .side {
                    position: fixed;
                    inset: 0 auto 0 0;
                    z-index: 30;
                    width: var(--side);
                    transform: translateX(-100%);
                    transition: transform 0.22s ease;
                }

                body.nav-open .side {
                    transform: none;
                    box-shadow: var(--shadow-lg);
                }

                body.nav-open .scrim {
                    position: fixed;
                    inset: 0;
                    z-index: 25;
                    display: block;
                    background: rgb(9 14 30 / 45%);
                }

                .menu-btn {
                    display: inline-grid;
                }

                .topbar {
                    padding: 12px 16px;
                    min-height: 64px;
                }

                .topbar h1 {
                    font-size: 19px;
                }

                .tabs {
                    margin: 0 16px;
                }

                .body {
                    padding: 16px 16px 40px;
                }

                .login {
                    grid-template-columns: minmax(0, 1fr);
                }

                .login-brand {
                    gap: 14px;
                    padding: 36px 24px;
                }

                .login-brand img {
                    width: 64px;
                    height: 64px;
                    border-radius: 16px;
                }
            }

            @media (max-width: 640px) {
                .topbar p {
                    display: none;
                }

                .topbar .acts .btn span {
                    display: none;
                }

                .grid {
                    grid-template-columns: minmax(0, 1fr);
                    padding: 18px;
                }

                .actions {
                    margin: 6px -18px -18px;
                    padding: 12px 18px;
                }

                .imgfield {
                    flex-direction: column;
                }

                .listbar .total {
                    display: none;
                }
            }
        </style>
    </head>

            // Options et valeurs par défaut adaptées au périmètre du compte.
            function applyPerimeter() {
                const national = ['SUPER_ADMIN', 'NATIONAL_ADMIN'].includes(
                    me.role,
                );
                const scopes =
                    me.role === 'CHURCH_ADMIN'
                        ? ['CHURCH']
                        : national
                          ? ['NATIONAL', 'DISTRICT', 'CHURCH']
                          : ['DISTRICT', 'CHURCH'];
                SCOPE.splice(0, SCOPE.length, ...scopes);
                AUDIENCE.splice(
                    0,
                    AUDIENCE.length,
                    ...scopes.map((s) => (s === 'NATIONAL' ? 'ALL' : s)),
                );
                ROLES.splice(
                    0,
                    ROLES.length,
                    ...(me.role === 'SUPER_ADMIN'
                        ? [
                              'SUPER_ADMIN',
                              'NATIONAL_ADMIN',
                              'DISTRICT_ADMIN',
                              'CHURCH_ADMIN',
                          ]
                        : ['DISTRICT_ADMIN', 'CHURCH_ADMIN']),
                );

                const target = {
                    scope_type: scopes[0],
                    district_id:
                        me.role === 'DISTRICT_ADMIN' ? me.district_id : null,
                    church_id: me.role === 'CHURCH_ADMIN' ? me.church_id : null,
                };
                RESOURCES.news.defaults = Object.assign(
                    {},
                    RESOURCES.news.defaults,
                    target,
                );
                RESOURCES.events.defaults = Object.assign({}, target);
                RESOURCES.notifications.defaults = {
                    audience: AUDIENCE[0],
                    district_id: target.district_id,
                    church_id: target.church_id,
                };
                RESOURCES.churches.defaults = {
                    status: 'ACTIVE',
                    district_id:
                        me.role === 'DISTRICT_ADMIN' ? me.district_id : null,
                };
            }

            // Télécharge un export protégé par le jeton (un lien simple ne
            // transmettrait pas l'en-tête Authorization).
            async function download(path, filename) {
                const res = await fetch(API + path, {
                    headers: { Authorization: 'Bearer ' + token },
                });
                if (!res.ok) throw new Error('Export impossible');
                const url = URL.createObjectURL(await res.blob());
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }

            // Ouvre directement le formulaire de création d'une ressource.
            function openNew(key) {
                state = { key, page: 1, search: '', editing: {} };
                history.pushState(null, '', '#' + key);
                renderApp();
            }

            // ------------------------------------------------------ dashboard
            function verseWidget(v) {
                const t = v.today;
                const n = t?.notification;
                const status = t ? pushStatus(n) : '';
                const canSend =
                    t && (!n || ['DRAFT', 'FAILED'].includes(n.status));
                const s = v.scheduled > 1 ? 's' : '';

                return `
            <section class="verse-card">
              <div class="verse-top">
                <span class="eyebrow">${icon('book-open')} Verset du jour</span>
                <a class="link-light" href="#verses">Tous les versets</a>
              </div>
              ${
                  t
                      ? `<blockquote>« ${esc(limitText(t.text, 280))} »</blockquote>
                <div class="verse-ref"><strong>${esc(t.reference)}</strong> · ${esc(t.bible_version)}</div>
                <div class="verse-foot">${status}${
                    canSend
                        ? `<button class="btn sm light" data-send="verses" data-id="${esc(t.id)}" data-confirm="Envoyer le verset du jour à tous les téléphones maintenant ?">${icon('send')} Envoyer maintenant</button>`
                        : ''
                }</div>`
                      : `<p class="verse-empty">Aucun verset n’est prévu aujourd’hui.</p>
                <button class="btn sm light" data-new="verses">${icon('plus')} Programmer un verset</button>`
              }

            // ------------------------------------------------------------ api
            async function api(path, { method = 'GET', body, raw } = {}) {
                const res = await fetch(API + path, {
                    method,
                    headers: Object.assign(
                        { Accept: 'application/json' },
                        token ? { Authorization: 'Bearer ' + token } : {},
                        raw ? {} : { 'Content-Type': 'application/json' },
                    ),
                    body: raw ? body : body ? JSON.stringify(body) : undefined,
                });

                const json = await res.json().catch(() => ({}));

                if (res.status === 401 && token) {
                    logout();
                    throw new Error('Session expirée');
                }
                if (!res.ok) {
                    const e = new Error(json?.error?.message || 'Erreur');
                    e.payload = json?.error;
                    throw e;
                }

                return json;
            }

            function toast(message, bad = false) {
                const el = $('toast');
                el.innerHTML =
                    icon(bad ? 'alert-circle' : 'check-circle') +
                    `<span>${esc(message)}</span>`;
                el.className = 'show' + (bad ? ' bad' : '');
                clearTimeout(toast.timer);
                toast.timer = setTimeout(
                    () => {
                        el.className = bad ? 'bad' : '';
                    },
                    bad ? 6000 : 3500,

            }

            // -------------------------------------------------------- helpers
            const esc = (v) =>
                String(v ?? '').replace(
                    /[&<>"']/g,
                    (c) =>
                        ({
                            '&': '&amp;',
                            '<': '&lt;',
                            '>': '&gt;',
                            '"': '&quot;',
                            "'": '&#39;',
                        })[c],
                );

            const dig = (row, path) =>
                path.split('.').reduce((o, k) => (o == null ? o : o[k]), row);

            const label = (row) =>
                row.title ||
                row.name ||
                row.reference ||
                row.original_name ||
                row.id;

            const fmtDate = (v) =>
                new Date(v).toLocaleString('fr-FR', {
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                });

            const fmtDay = (iso) =>
                new Date(iso + 'T00:00:00Z').toLocaleDateString('fr-FR', {
                    weekday: 'short',
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric',
                    timeZone: 'UTC',
                });

            const skeleton = (n = 5) =>
                `<div class="skel">${'<div class="sk-row"><span></span><span></span><span></span><span></span></div>'.repeat(n)}</div>`;

            const errorState = (message) =>
                `<div class="empty">${icon('alert-circle')}<strong>Chargement impossible</strong><p>${esc(message)}</p></div>`;

            function mediaUrl(url) {
                if (!url) return '';

                try {
                    const parsed = new URL(url, location.origin);

                    const localHosts = ['localhost', '127.0.0.1'];
                    const localMediaPath =
                        parsed.pathname.startsWith('/storage/') ||
                        parsed.pathname.startsWith('/api/v1/media/');

                    if (
                        localMediaPath &&
                        localHosts.includes(parsed.hostname) &&
                        localHosts.includes(location.hostname)
                    ) {
                        return location.origin + BASE + parsed.pathname;
                    }

                    return parsed.href;
                } catch {
                    return String(url).startsWith('/storage/') ||
                        String(url).startsWith('/api/v1/media/')
                        ? location.origin + BASE + url
                        : String(url);
                }
            }

            const badge = (v) =>
                `<span class="badge dot ${TONE[v] || ''}">${esc(human(v))}</span>`;

            const plural = (n, word) => n + ' ' + word + (n > 1 ? 's' : '');

            /**
             * `SENT` signifie « FCM a accepté l'envoi », pas « un téléphone a reçu ».
             * Un envoi dont tous les tokens étaient périmés est un SENT à 0 livraison :
             * sans ce bilan, l'administrateur croirait la notification partie.
             */
            function deliveryCell(row) {
                if (row.status !== 'SENT' && row.status !== 'FAILED')
                    return '<span class="badge">—</span>';

                const out = [
                    `<span class="badge ${
                        row.delivered_count > 0 ? 'ok' : 'bad'
                    }">${plural(row.delivered_count || 0, 'livrée')}</span>`,
                ];

                if (row.pruned_count > 0)
                    out.push(
                        `<span class="badge warn">${plural(
                            row.pruned_count,
                            'token mort',
                        )}</span>`,
                    );

                if (row.failed_count > 0)
                    out.push(
                        `<span class="badge bad">${plural(
                            row.failed_count,
                            'échec',
                        )}</span>`,
                    );

                return out.join(' ');
            }

            function cell(row, [path, , type]) {
                const v = dig(row, path);

                if (type === 'delivery') return deliveryCell(row);

                if (type === 'thumb')
                    return `<div class="rowthumb">${
                        v
                            ? `<img src="${esc(mediaUrl(v))}" alt="" loading="lazy">`
                            : ''
                    }</div>`;

                if (type === 'excerpt')
                    return `<span class="excerpt">${esc(limitText(v, 90))}</span>`;

                if (type === 'verse-day') {
                    const today = todayISO();
                    const chip =
                        v === today
                            ? '<span class="badge dot info">Aujourd’hui</span>'
                            : v > today
                              ? '<span class="badge dot warn">Programmé</span>'
                              : '';
                    return `<div class="daycell"><span>${esc(fmtDay(v))}</span>${chip}</div>`;
                }

                if (type === 'verse-notif') {
                    if (!v)
                        return row.publication_date > todayISO()
                            ? '<span class="muted-sm">Le jour même à 07 h 00</span>'
                            : '<span class="badge">—</span>';
                    if (v.status === 'SENT')
                        return `<span class="badge dot ok" title="${esc(v.sent_at ? fmtDate(v.sent_at) : '')}">Envoyée · ${plural(v.delivered_count || 0, 'téléphone')}</span>`;
                    return `<span class="badge dot ${TONE[v.status] || ''}" title="${esc(v.last_error || '')}">${esc(human(v.status))}</span>`;
                }

                if (v === true) return '<span class="badge ok">Oui</span>';
                if (v === false) return '<span class="badge">Non</span>';
                if (v == null || v === '')
                    return '<span class="badge">—</span>';
                if (/_at$/.test(path)) return esc(fmtDate(v));
                if (typeof v === 'string' && /^[A-Z][A-Z_]+$/.test(v))
                    return badge(v);

                return esc(v);
            }

            // Relation dropdowns stay small; cache them per resource.
            const refCache = {};
            async function refOptions(key) {
                if (!refCache[key]) {
                    refCache[key] = api('/admin/' + key + '?per_page=100')
                        .then((r) =>
                            r.data.map((row) => ({
                                id: row.id,
                                label: label(row),
                            })),
                        )
                        .catch(() => []);
                }
                return refCache[key];
            }

            // id -> media, so a preview never refetches what we already saw.
            const mediaCache = {};

            function remember(media) {
                if (media && media.url) media.url = mediaUrl(media.url);
                if (media && media.id) mediaCache[media.id] = media;
                return media;
            }

            async function getMedia(id) {
                if (!id) return null;
                if (mediaCache[id]) return mediaCache[id];
                try {
                    return remember((await api('/admin/media/' + id)).data);
                } catch {
                    return null;
                }
            }

            // The API only gives the nested object; keep its url for previews.
            function rememberRowMedia(row) {
                ['cover', 'media', 'image', 'photo', 'illustration'].forEach(
                    (k) => remember(row[k]),
                );
                return row;
            }

            async function upload(file) {
                const form = new FormData();
                form.append('file', file);
                const res = await api('/admin/media', {
                    method: 'POST',
                    body: form,
                    raw: true,
                });
                delete refCache.media;
                return remember(res.data);
            }

            // ------------------------------------------------------ media grid
            function tile(media, { selected = false, tools = '' } = {}) {
                return `
            <button type="button" class="tile" data-id="${esc(media.id)}" aria-pressed="${selected}">

            }

            // --------------------------------------------------- media picker
            /** Resolves with a media object, null to clear, or undefined on cancel. */
            function pickMedia(currentId) {
                return new Promise((resolve) => {
                    let page = 1;
                    let last = 1;

                    $('modal').innerHTML = `
            <div class="overlay" data-dismiss>
              <div class="modal" role="dialog" aria-modal="true" aria-label="Choisir une image">
                <header>
                  <h2>Choisir une image</h2>
                  <label class="btn">${icon('upload')} Importer…
                    <input type="file" accept="${ACCEPT}" multiple hidden id="pickup">
                  </label>
                  <button class="iconbtn" data-close aria-label="Fermer">${icon('x')}</button>
                </header>
                <div class="content"><div class="gallery" id="pickgrid"></div></div>
                <footer>
                  <button class="btn ghost" data-clear>Aucune image</button>
                  <span class="spacer"></span>
                  <span id="pickinfo"></span>
                  <button class="iconbtn" data-prev aria-label="Page précédente">${icon('chevron-left')}</button>
                  <button class="iconbtn" data-next aria-label="Page suivante">${icon('chevron-right')}</button>
                </footer>
              </div>
            </div>`;

                    const modal = $('modal');
                    const grid = $('pickgrid');
                    const q = (sel) => modal.querySelector(sel);

                    const close = (value) => {
                        document.removeEventListener('keydown', onKey);
                        modal.innerHTML = '';
                        resolve(value);
                    };

                    const onKey = (e) => {
                        if (e.key === 'Escape') close(undefined);
                    };
                    document.addEventListener('keydown', onKey);

                    const load = async () => {
                        grid.innerHTML = '<p class="empty">Chargement…</p>';
                        let data, meta;
                        try {
                            ({ data, meta } = await api(
                                `/admin/media?page=${page}&per_page=24`,
                            ));
                        } catch (err) {
                            grid.innerHTML = errorState(err.message);
                            return;
                        }

                        last = meta.last_page;
                        data.forEach(remember);

                        grid.innerHTML = data.length
                            ? data
                                  .map((m) =>
                                      tile(m, { selected: m.id === currentId }),
                                  )
                                  .join('')
                            : `<div class="empty">${icon('image')}<strong>Aucune image</strong><p>Importez-en une avec le bouton « Importer ».</p></div>`;

                        grid.querySelectorAll('.tile').forEach((el) => {
                            el.onclick = () =>
                                close(mediaCache[el.dataset.id] || null);
                        });

                        q('#pickinfo').textContent =
                            `page ${meta.page}/${last}`;
                        q('[data-prev]').disabled = page <= 1;
                        q('[data-next]').disabled = page >= last;
                    };

                    q('#pickup').onchange = async (e) => {
                        const files = [...e.target.files];
                        e.target.value = '';
                        if (!files.length) return;
                        try {
                            const uploaded = [];
                            for (const file of files)
                                uploaded.push(await upload(file));
                            toast(`${uploaded.length} image(s) importée(s)`);
                            close(uploaded[uploaded.length - 1]);
                        } catch (err) {
                            toast(err.message, true);
                        }
                    };

                    q('[data-close]').onclick = () => close(undefined);
                    q('[data-clear]').onclick = () => close(null);
                    q('[data-prev]').onclick = () => {
                        page--;
                        load();
                    };
                    q('[data-next]').onclick = () => {
                        page++;
                        load();
                    };
                    q('[data-dismiss]').onclick = (e) => {
                        if (e.target === e.currentTarget) close(undefined);
                    };

                    load();
                });
            }

            // --------------------------------------------------------- render
            function renderLogin(error = '') {

            async function renderApp() {

                        .map((it) => ({

                    return (
                        (section.title
