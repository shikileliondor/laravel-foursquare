                            : '') +
                        items
                            .map(
                                (it) =>
                                    `<a href="#${it.first}" class="${
                                        it.tabs.includes(state.key)
                                            ? 'active'
                                            : ''
                                    }">${icon(it.icon)}<span>${esc(it.label)}</span></a>`,
                            )
                            .join('')
                    );
                }).join('');

                const initials = String(me.name || '?')
                    .split(/\s+/)
                    .filter(Boolean)
                    .slice(0, 2)
                    .map((w) => w[0].toUpperCase())
                    .join('');
                const place = me.church
                    ? me.church.name
                    : me.district
                      ? me.district.name
                      : '';

                root.innerHTML = `
            <div id="app">
              <aside class="side" aria-label="Menu principal">
                <div class="brand">
                  <img src="${ASSET}logo.jpg" alt="">
                  <div><strong>Foursquare CI</strong><span>Administration</span></div>
                </div>
                <div class="fourbar"><i></i><i></i><i></i><i></i></div>
                <nav>${nav}</nav>
                <div class="grow"></div>
                <div class="user">
                  <span class="avatar">${esc(initials)}</span>
                  <div class="who"><strong>${esc(me.name)}</strong><span>${esc(me.role_label || human(me.role))}${place ? ' · ' + esc(place) : ''}</span></div>
                  <button class="iconbtn" id="logout" title="Se déconnecter" aria-label="Se déconnecter">${icon('log-out')}</button>
                </div>
              </aside>
              <div class="scrim" data-scrim></div>
              <main id="main"></main>
            </div>`;

                $('logout').onclick = logout;
                root.onclick = (e) => {
                    // Un lien vers la page déjà ouverte ne change pas le hash :
                    // il doit quand même refermer un formulaire en cours.
                    const link = e.target.closest('a[href^="#"]');
                    if (
                        link &&
                        link.getAttribute('href') === location.hash &&
                        state.editing
                    ) {
                        e.preventDefault();
                        state.editing = null;
                        document.body.classList.remove('nav-open');
                        renderApp();
                        return;
                    }

                    if (e.target.closest('[data-menu]'))
                        document.body.classList.toggle('nav-open');
                    else if (
                        e.target.closest('[data-scrim]') ||
                        e.target.closest('.side a')
                    )
                        document.body.classList.remove('nav-open');
                };
                state.editing ? renderForm() : renderList();
            }

            function renderHead(res, actions = '', opts = {}) {
                const entry = entryOf(state.key);
                const tabs = entry ? entry.tabs.filter(allowed) : [];
                const title = opts.title || entry?.label || res.label;
                const sub = opts.sub !== undefined ? opts.sub : res.description;

                return `
            <header class="topbar">
              <button class="iconbtn menu-btn" data-menu aria-label="Ouvrir le menu">${icon('menu')}</button>
              ${opts.back ? `<button class="iconbtn" id="back" aria-label="Retour à la liste">${icon('chevron-left')}</button>` : ''}
              <div class="titles"><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div>
              ${actions ? `<div class="acts">${actions}</div>` : ''}
            </header>
            ${
                !opts.back && tabs.length > 1
                    ? `<nav class="tabs" aria-label="Sections">${tabs
                          .map(
                              (k) =>
                                  `<a href="#${k}" class="${k === state.key ? 'active' : ''}">${esc(RESOURCES[k].tab || RESOURCES[k].label)}</a>`,
                          )
                          .join('')}</nav>`
                    : ''
            }`;
            }

            function bindSearch(reload) {
                const input = $('search');
                if (!input) return;
                input.oninput = () => {
                    clearTimeout(bindSearch.timer);
                    bindSearch.timer = setTimeout(() => {
                        state.search = input.value;
                        state.page = 1;
                        reload();
                    }, 300);
                };
            }

            function renderList() {
                const key = state.key;
                const res = RESOURCES[key];

                if (res.view === 'gallery') return renderGallery();
                if (res.view === 'dashboard') return renderDashboard();
                if (res.view === 'settings') return renderSettings();

                $('main').innerHTML =
                    renderHead(
                        res,
                        (res.exportPath
                            ? `<button class="btn" id="export">${icon('download')}<span>Exporter (CSV)</span></button>`
                            : '') +
                            (res.noCreate
                                ? ''
                                : `<button class="btn primary" id="create">${icon('plus')}<span>${esc(res.newLabel || 'Nouveau')}</span></button>`),
                    ) +
                    `<div class="body"><div class="card">
                ${
                    res.search
                        ? `<div class="listbar">
                  <div class="searchbox">${icon('search')}<input id="search" type="search" placeholder="Rechercher…" aria-label="Rechercher" value="${esc(state.search)}"></div>
                  <span class="total" id="total"></span>
                </div>`
                        : ''
                }
                <div id="rows">${skeleton()}</div>
              </div></div>`;

                bindSearch(loadRows);

                if (res.exportPath)
                    $('export').onclick = () =>
                        download(res.exportPath, key + '.csv').catch((err) =>
                            toast(err.message, true),
                        );

                if (!res.noCreate) $('create').onclick = () => openNew(key);

                loadRows();
            }

            // Recharge seulement les lignes : la recherche garde le focus.
            async function loadRows() {
                const key = state.key;
                const res = RESOURCES[key];
                const rows = $('rows');
                if (!rows) return;

                const query =
                    `?page=${state.page}&per_page=20` +
                    (state.search
                        ? `&search=${encodeURIComponent(state.search)}`
                        : '');

                let data, meta;
                try {
                    ({ data, meta } = await api('/admin/' + key + query));
                } catch (err) {
                    rows.innerHTML = errorState(err.message);
                    return;
                }

                // Une navigation plus récente a remplacé cette page.
                if (state.key !== key || $('rows') !== rows) return;

                data.forEach(rememberRowMedia);

                if ($('total'))
                    $('total').textContent = plural(meta.total, 'élément');

                if (!data.length) {
                    rows.innerHTML = state.search
                        ? `<div class="empty">${icon('search')}<strong>Aucun résultat</strong><p>Rien ne correspond à « ${esc(state.search)} ».</p></div>`
                        : `<div class="empty">${icon('inbox')}<strong>Rien pour le moment</strong><p>Les éléments créés apparaîtront ici.</p>${
                              res.noCreate
                                  ? ''
                                  : `<button class="btn primary" id="create2">${icon('plus')} ${esc(res.newLabel || 'Nouveau')}</button>`
                          }</div>`;
                    if ($('create2')) $('create2').onclick = () => openNew(key);
                    return;
                }

                const actions = res.rowActions || [];

                rows.innerHTML = `
            <div class="tablewrap"><table>
              <thead><tr>${res.columns
                  .map((c) => `<th>${esc(c[1])}</th>`)
                  .join(
                      '',
                  )}<th><span class="sr">Actions</span></th></tr></thead>
              <tbody>
                ${data
                    .map(
                        (row, i) => `
                  <tr>
                    ${res.columns
                        .map(
                            (c) =>
                                `<td${c[2] === 'title' ? ' class="title"' : ''}>${cell(row, c)}</td>`,
                        )
                        .join('')}
                    <td class="acts"><div class="rowacts">
                      ${actions
                          .map((a, ai) =>
                              a.show(row)
                                  ? `<button class="btn sm" data-act="${i}:${ai}">${a.icon ? icon(a.icon) : ''}${esc(a.label)}</button>`
                                  : '',
                          )
                          .join('')}
                      ${res.noEdit ? '' : `<button class="iconbtn" data-edit="${i}" title="Modifier" aria-label="Modifier ${esc(label(row))}">${icon('pencil')}</button>`}
                      ${res.noDelete ? '' : `<button class="iconbtn danger" data-del="${i}" title="Supprimer" aria-label="Supprimer ${esc(label(row))}">${icon('trash')}</button>`}
                    </div></td>
                  </tr>`,
                    )
                    .join('')}
              </tbody>
            </table></div>
            ${
                meta.last_page > 1
                    ? `<div class="pager">
              <span>Page ${meta.page} sur ${meta.last_page} · ${plural(meta.total, 'élément')}</span>
              <span class="spacer"></span>
              <button class="iconbtn" id="prev" aria-label="Page précédente" ${meta.page <= 1 ? 'disabled' : ''}>${icon('chevron-left')}</button>
              <button class="iconbtn" id="next" aria-label="Page suivante" ${meta.page >= meta.last_page ? 'disabled' : ''}>${icon('chevron-right')}</button>
            </div>`
                    : ''
            }`;

                rows.querySelectorAll('[data-act]').forEach((b) => {
                    const [i, ai] = b.dataset.act.split(':').map(Number);
                    const row = data[i];
                    const act = actions[ai];
                    b.onclick = async () => {
                        // Un message vide vaut « pas de confirmation » :
                        // une action peut n'interroger que dans certains cas.
                        const question = act.confirm?.(row);
                        if (question && !confirm(question)) return;
                        b.disabled = true;
                        try {
                            const r = await api(
                                '/admin/' +
                                    key +
                                    '/' +
                                    row.id +
                                    (act.path || ''),
                                {
                                    method: act.method || 'PATCH',
                                    body: act.patch,
                                },
                            );
                            toast(
                                ...(typeof act.done === 'function'
                                    ? act.done(r.data)
                                    : [act.done]),
                            );
                            loadRows();
                        } catch (err) {
                            b.disabled = false;
                            toast(err.message, true);
                        }
                    };
                });

                rows.querySelectorAll('[data-edit]').forEach((b) => {
                    b.onclick = async () => {
                        b.disabled = true;
                        try {
                            state.editing = rememberRowMedia(
                                (
                                    await api(
                                        '/admin/' +
                                            key +
                                            '/' +
                                            data[b.dataset.edit].id,
                                    )
                                ).data,
                            );
                            renderForm();
                        } catch (err) {
                            b.disabled = false;
                            toast(err.message, true);
                        }
                    };
                });

                rows.querySelectorAll('[data-del]').forEach((b) => {
                    b.onclick = async () => {
                        const row = data[b.dataset.del];
                        if (!confirm(`Supprimer « ${label(row)} » ?`)) return;
                        try {
                            await api('/admin/' + key + '/' + row.id, {
                                method: 'DELETE',
                            });
                            delete refCache[key];
                            toast('Supprimé');
                            loadRows();
                        } catch (err) {
                            toast(err.message, true);
                        }
                    };
                });

                if ($('prev'))
                    $('prev').onclick = () => {
                        state.page--;
                        loadRows();
                    };
                if ($('next'))
                    $('next').onclick = () => {
                        state.page++;
                        loadRows();
                    };
            }

            // ------------------------------------------------- media gallery
            async function renderGallery() {
                const res = RESOURCES.media;

                $('main').innerHTML =
                    renderHead(
                        res,
                        `<label class="btn primary">${icon('upload')}<span>Importer des images</span>
              <input type="file" accept="${ACCEPT}" multiple hidden id="up"></label>`,
                    ) +
                    `<div class="body">
               <div class="dropzone" id="drop">${icon('upload')}<strong>Glissez vos images ici</strong><span>ou cliquez pour les choisir — JPG, PNG ou WebP, 5 Mo max.</span></div>
               <div class="gallery" id="grid" style="margin-top:20px"><p class="empty">Chargement…</p></div>
               <div class="pager card" id="gpager" style="margin-top:16px" hidden></div>
             </div>`;

                const grid = $('grid');

                const importFiles = async (files) => {
                    const images = [...files].filter((f) =>
                        ACCEPT.includes(f.type),
                    );
                    if (!images.length)
                        return toast('Formats acceptés : JPG, PNG, WebP', true);
                    try {
                        for (const file of images) await upload(file);
                        toast(`${images.length} image(s) importée(s)`);
                        state.page = 1;
                        renderGallery();
                    } catch (err) {
                        toast(err.message, true);
                    }
                };

                $('up').onchange = (e) => {
                    const files = e.target.files;
                    e.target.value = '';
                    importFiles(files);
                };

                const drop = $('drop');
                drop.onclick = () => $('up').click();
                drop.ondragover = (e) => {
                    e.preventDefault();
                    drop.classList.add('over');
                };
                drop.ondragleave = () => drop.classList.remove('over');
                drop.ondrop = (e) => {
                    e.preventDefault();
                    drop.classList.remove('over');
                    importFiles(e.dataTransfer.files);
                };

                let data, meta;
                try {
                    ({ data, meta } = await api(
                        `/admin/media?page=${state.page}&per_page=24`,
                    ));
                } catch (err) {
                    grid.innerHTML = errorState(err.message);
                    return;
                }

                data.forEach(remember);

                if (!data.length) {
                    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${icon('image')}<strong>Aucune image pour le moment</strong><p>Les images importées apparaîtront ici.</p></div>`;
                    return;
                }

                grid.innerHTML = data
                    .map((m) =>
                        tile(m, {
                            tools: `
                <span class="btn sm" data-copy="${esc(m.id)}">Copier l’URL</span>
                <span class="btn sm danger" data-drop="${esc(m.id)}">Supprimer</span>`,
                        }),
                    )
                    .join('');

                grid.querySelectorAll('[data-copy]').forEach((el) => {
                    el.onclick = (e) => {
                        e.stopPropagation();
                        navigator.clipboard
                            .writeText(mediaCache[el.dataset.copy].url)
                            .then(() => toast('URL copiée'))
                            .catch(() => toast('Copie impossible', true));
                    };
                });

                grid.querySelectorAll('[data-drop]').forEach((el) => {
                    el.onclick = async (e) => {
                        e.stopPropagation();
                        const m = mediaCache[el.dataset.drop];
                        if (
                            !confirm(
                                `Supprimer « ${label(m)} » ? Les contenus qui l’utilisent perdront leur image.`,
                            )
                        )
                            return;
                        try {
                            await api('/admin/media/' + m.id, {
                                method: 'DELETE',
                            });
                            delete mediaCache[m.id];
                            delete refCache.media;
                            toast('Image supprimée');
                            renderGallery();
                        } catch (err) {
                            toast(err.message, true);
                        }
                    };
                });

                // Clicking the tile itself just opens the file in a new tab.
                grid.querySelectorAll('.tile').forEach((el) => {
                    el.onclick = () =>
                        window.open(mediaCache[el.dataset.id].url, '_blank');
                });

                if (meta.last_page > 1) {
                    const pager = $('gpager');
                    pager.hidden = false;
                    pager.innerHTML = `
              <span>Page ${meta.page} sur ${meta.last_page} · ${meta.total} image(s)</span>
              <span class="spacer"></span>
              <button class="iconbtn" id="gprev" aria-label="Page précédente" ${meta.page <= 1 ? 'disabled' : ''}>${icon('chevron-left')}</button>
              <button class="iconbtn" id="gnext" aria-label="Page suivante" ${meta.page >= meta.last_page ? 'disabled' : ''}>${icon('chevron-right')}</button>`;
                    $('gprev').onclick = () => {
                        state.page--;
                        renderGallery();
                    };
                    $('gnext').onclick = () => {
                        state.page++;
                        renderGallery();
                    };
                }
            }

            // ----------------------------------------------------------- form
            async function renderForm(errors = {}) {
                const key = state.key;
                const res = RESOURCES[key];
                const row = state.editing;
                const isNew = !row.id;

                // Load every relation list this form needs before drawing it.
                const refs = {};
                await Promise.all(
                    res.fields
                        .filter((f) => f.type === 'ref')
                        .map(async (f) => {
                            refs[f.name] = await refOptions(f.ref);
                        }),
                );

                const values = Object.assign(
                    {},
                    isNew ? res.defaults || {} : {},
                    row,
                );
                const visible = (f) => !f.showIf || f.showIf(values);
                const title = isNew
                    ? res.newLabel || 'Nouveau — ' + res.label
                    : res.editLabel
                      ? res.editLabel
                      : 'Modifier « ' + label(row) + ' »';

                const draw = () => {
                    $('main').innerHTML =
                        renderHead(res, '', {
                            back: true,
                            title,
                            sub: entryOf(key)?.label,
                        }) +
                        `<div class="body"><div class="form-layout${res.preview ? ' has-preview' : ''}">
                <div class="card form-card">
                  <form id="form" class="grid" novalidate>
                    ${res.fields
                        .filter(visible)
                        .map((f) =>
                            field(
                                f,
                                values[f.name],
                                errors[f.name],
                                refs[f.name],
                            ),
                        )
                        .join('')}
                    <div class="actions">
                      <button class="btn ghost" type="button" id="cancel">Annuler</button>
                      <span class="spacer"></span>
                      <button class="btn primary" type="submit">${isNew ? icon('plus') + ' Créer' : 'Enregistrer'}</button>
                    </div>
                  </form>
                </div>
                ${res.preview ? '<aside class="card preview-card" id="pv" aria-label="Aperçu"></aside>' : ''}
              </div></div>`;

                    const form = $('form');

                    $('cancel').onclick = $('back').onclick = () => {
                        state.editing = null;
                        renderList();
                    };

                    bindImageFields(form, values);
                    bindRichText(form);

                    if (res.preview) {
                        const paint = () => {
                            $('pv').innerHTML = res.preview(
                                Object.assign({}, values, collect(form, res)),
                                row,
                            );
                        };
                        form.addEventListener('input', paint);
                        paint();
                    }

                    // Conditional fields follow scope_type / link_type / type / audience.
                    [
                        'scope_type',
                        'link_type',
                        'type',
                        'audience',
                        'role',
                    ].forEach((name) => {
                        const el = form.elements[name];
                        if (!el) return;
                        el.onchange = () => {
                            Object.assign(values, collect(form, res));
                            draw();
                        };
                    });

                    form.onsubmit = async (e) => {
                        e.preventDefault();
                        const payload = {};

                        res.fields.forEach((f) => {
                            if (!f.name) return;

                            // A hidden conditional field is explicitly cleared,
                            // otherwise a stale target would survive the change.
                            if (!visible(f)) {
                                if (f.showIf) payload[f.name] = null;
                                return;
                            }

                            const el = form.elements[f.name];
                            if (!el) return;

                            if (f.type === 'checkbox')
                                payload[f.name] = el.checked;
                            else if (f.type === 'number')
                                payload[f.name] =
                                    el.value === '' ? null : Number(el.value);
                            else
                                payload[f.name] =
                                    el.value === '' ? null : el.value;
                        });

                        const btn = form.querySelector('[type=submit]');
                        btn.disabled = true;

                        try {
                            const r = await api(
                                '/admin/' + key + (isNew ? '' : '/' + row.id),
                                {
                                    method: isNew ? 'POST' : 'PATCH',
                                    body: payload,
                                },
                            );
                            delete refCache[key];
                            state.editing = null;
                            toast(
                                ...(res.afterSave?.(r.data, row) || [
                                    isNew ? 'Créé' : 'Enregistré',
                                ]),
                            );
                            renderList();
                        } catch (err) {
                            btn.disabled = false;
                            const fields = err.payload?.fields || {};
                            toast(
                                Object.keys(fields).length
                                    ? 'Corrigez les champs en rouge'
                                    : err.message,
                                true,
                            );
                            state.editing = Object.assign(
                                {},
                                values,
                                collect(form, res),
                            );
                            renderForm(fields);
                        }
                    };
                };

                draw();
            }

            function collect(form, res) {
                const out = {};
                res.fields.forEach((f) => {
                    if (!f.name) return;
                    const el = form.elements[f.name];
                    if (!el) return;
                    out[f.name] = f.type === 'checkbox' ? el.checked : el.value;
                });
                return out;
            }

            // Fill the thumbnail and wire the picker for every image field.
            function bindImageFields(form, values) {
                form.querySelectorAll('[data-image]').forEach((box) => {
                    const name = box.dataset.image;
                    const input = box.querySelector('input[type=hidden]');
                    const prev = box.querySelector('.imgprev');
                    const clear = box.querySelector('[data-clear]');

                    const paint = async () => {
                        clear.hidden = !input.value;
                        const m = await getMedia(input.value);
                        prev.innerHTML = m
                            ? `<img src="${esc(m.url)}" alt="">`
                            : `<span>Aucune image</span>`;
                    };

                    box.querySelector('[data-pick]').onclick = async () => {
                        const picked = await pickMedia(input.value);
                        if (picked === undefined) return;
                        input.value = picked ? picked.id : '';
                        values[name] = input.value || null;
                        paint();
                    };

                    clear.onclick = () => {
                        input.value = '';
                        values[name] = null;
                        paint();
                    };

                    paint();
                });
            }

            // Minimal formatting helpers: wrap the selection, no editor needed.
            const TAGS = [
                ['Gras', 'strong'],
                ['Italique', 'em'],
                ['Titre', 'h2'],
                ['Paragraphe', 'p'],
                ['Liste', 'ul'],
                ['Lien', 'a'],
            ];

            function bindRichText(form) {
                form.querySelectorAll('[data-rich]').forEach((box) => {
                    const ta = box.querySelector('textarea');
                    const preview = box.querySelector('.preview');
                    const toggle = box.querySelector('[data-preview]');

                    box.querySelectorAll('[data-tag]').forEach((btn) => {
                        btn.onclick = () => {
                            const tag = btn.dataset.tag;
                            const s = ta.selectionStart;
                            const e = ta.selectionEnd;
                            const sel = ta.value.slice(s, e) || 'texte';

                            const html =
                                tag === 'ul'
                                    ? `<ul>\n  <li>${sel}</li>\n</ul>`
                                    : tag === 'a'
                                      ? `<a href="https://">${sel}</a>`
                                      : `<${tag}>${sel}</${tag}>`;

                            ta.setRangeText(html, s, e, 'end');
                            ta.focus();
                        };
                    });

                    toggle.onclick = () => {
                        const showing = !preview.hidden;
                        preview.hidden = showing;
                        ta.hidden = !showing;
                        toggle.innerHTML = showing
                            ? icon('eye') + ' Aperçu'
                            : icon('pencil') + ' Éditer';
                        if (!showing) preview.innerHTML = ta.value;
                    };
                });
            }

            // ---------------------------------------------------------- field
            function field(f, value, error, options) {
                if (f.section)
                    return `<div class="fsec">${esc(f.section)}</div>`;

                const err = error ? `<p class="err">${esc(error[0])}</p>` : '';
                const hint = f.hint ? `<p class="hint">${esc(f.hint)}</p>` : '';
                const cls =
                    'field' +
                    (f.wide || f.type === 'textarea' || f.type === 'richtext'
                        ? ' wide'
                        : '') +
                    (error ? ' has-err' : '');
                const id = 'f_' + f.name;
                const req = f.required ? 'required' : '';
                const lbl = `<label for="${id}">${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</label>`;

                if (f.type === 'checkbox')
                    return `<div class="${cls}"><div class="check">
              <input type="checkbox" name="${f.name}" id="${id}" ${value ? 'checked' : ''}>
              <label for="${id}">${esc(f.label)}</label></div>${hint}${err}</div>`;

                if (f.type === 'image')
                    return `<div class="${cls}" data-image="${f.name}">
              ${lbl}
              <div class="imgfield">
                <div class="imgprev"><span>Aucune image</span></div>
                <div class="imgacts">
                  <button type="button" class="btn" data-pick>${icon('image')} Choisir une image</button>
                  <button type="button" class="btn ghost" data-clear hidden>Retirer</button>
                  <p class="hint">JPG, PNG ou WebP — 5 Mo max. L’import se fait depuis la fenêtre de sélection.</p>
                </div>
              </div>
              <input type="hidden" name="${f.name}" value="${esc(value)}">
              ${err}</div>`;

                if (f.type === 'richtext')
                    return `<div class="${cls}" data-rich>
              ${lbl}
              <div class="toolbar">
                ${TAGS.map(
                    ([text, tag]) =>
                        `<button type="button" class="btn" data-tag="${tag}">${text}</button>`,
                ).join('')}
                <button type="button" class="btn" data-preview>${icon('eye')} Aperçu</button>
              </div>
              <textarea name="${f.name}" id="${id}" rows="12" ${req}>${esc(value)}</textarea>
              <div class="preview" hidden></div>
              <p class="hint">HTML limité : p, br, strong, em, u, ul, ol, li, h2-h4, blockquote, a. Le reste est retiré à l’enregistrement.</p>
              ${err}</div>`;

                if (f.type === 'select')
                    return `<div class="${cls}">${lbl}
              <select name="${f.name}" id="${id}" ${req}>
                ${f.required ? '' : '<option value="">—</option>'}
                ${value && !f.options.includes(value) ? `<option value="${esc(value)}" selected>${esc(human(value))}</option>` : ''}
                ${f.options
                    .map(
                        (o) =>
                            `<option value="${esc(o)}" ${o === value ? 'selected' : ''}>${esc(human(o))}</option>`,
                    )
                    .join('')}
              </select>${hint}${err}</div>`;

                if (f.type === 'ref')
                    return `<div class="${cls}">${lbl}
              <select name="${f.name}" id="${id}" ${req}>
                <option value="">—</option>
                ${(options || [])
                    .map(
                        (o) =>
                            `<option value="${esc(o.id)}" ${o.id === value ? 'selected' : ''}>${esc(o.label)}</option>`,
                    )
                    .join('')}
              </select>${hint}${err}</div>`;

                if (f.type === 'textarea')
                    return `<div class="${cls}">${lbl}
              <textarea name="${f.name}" id="${id}" rows="${f.rows || 4}" ${req}>${esc(value)}</textarea>${hint}${err}</div>`;

                const v =
                    f.type === 'datetime-local' && value
                        ? String(value).slice(0, 16)
                        : value;

                return `<div class="${cls}">${lbl}
              <input name="${f.name}" id="${id}" type="${f.type || 'text'}" ${
                  f.type === 'number' ? 'step="any"' : ''
              } value="${esc(v)}" ${req}>${hint}${err}</div>`;
            }

            // ----------------------------------------------------------- boot
            window.onhashchange = () => {
                const key = location.hash.slice(1);
                document.body.classList.remove('nav-open');
                if (RESOURCES[key]) {
                    state = { key, page: 1, search: '', editing: null };
                    renderApp();
                }
            };

            const initial = location.hash.slice(1);
            state.key = RESOURCES[initial] ? initial : 'dashboard';

            token ? renderApp() : renderLogin();
        </script>
    </body>
</html>
